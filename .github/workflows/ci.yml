name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend-and-contracts:
    name: Backend and contracts
    runs-on: ubuntu-latest
    # Тесты API идут на настоящем PostgreSQL, а не на подменной СУБД:
    # SQLite из проекта убран 05.09, и подменять базу в тестах значило бы
    # проверять другую модель параллелизма, чем та, что поставляется
    # (блокировки строк, FOR UPDATE, конкурентное удаление документа).
    # Без этого сервиса шаг «Test backend» падал с Connection refused,
    # и main был красным начиная с перевода на PostgreSQL.
    services:
      postgres:
        image: postgres:16
        env:
          # Роль обязана иметь CREATEDB: conftest создаёт отдельную базу
          # на каждый тест. postgres — суперпользователь, этого достаточно.
          POSTGRES_USER: docreview
          POSTGRES_PASSWORD: docreview
          POSTGRES_DB: docreview
        ports:
          - 5432:5432
        # Без health-check шаги стартуют раньше, чем СУБД примет соединение,
        # и падение выглядит как ошибка тестов, а не как гонка запуска.
        options: >-
          --health-cmd "pg_isready -U docreview"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DOCREVIEW_TEST_DATABASE_URL: postgresql+psycopg://docreview:docreview@127.0.0.1:5432/docreview
      # Приложение требует ровно UTC: ReviewJobLifecycle отвергает метку
      # времени с ненулевым смещением (`_require_utc`). PostgreSQL отдаёт
      # timestamptz в часовом поясе сессии, поэтому база в любом другом
      # поясе роняет 29 тестов жизненного цикла. Проверено: на машине
      # в Europe/Moscow падают, с PGTZ=UTC — 260 passed. Образ postgres:16
      # по умолчанию в UTC, но полагаться на умолчание образа не будем.
      PGTZ: UTC
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.lock
            contracts/requirements.lock
      - name: Install Python dependencies
        run: |
          python -m pip install -r apps/api/requirements.lock -r contracts/requirements.lock
          python -m pip install --no-deps --no-build-isolation -e apps/api
          python -m pip install --no-deps --no-build-isolation -e apps/mock-analysis-core
      - name: Validate JSON contract
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Lint backend
        working-directory: apps/api
        run: python -m ruff check src tests alembic
      - name: Check backend formatting
        working-directory: apps/api
        run: python -m ruff format --check src tests alembic
      - name: Type-check backend
        working-directory: apps/api
        run: python -m mypy
      - name: Test backend
        working-directory: apps/api
        run: python -m pytest --cov
      - name: Check Mock Analysis Core
        working-directory: apps/mock-analysis-core
        run: |
          python -m ruff check src tests tools
          python -m ruff format --check src tests tools
          python -m mypy
          python -m pytest --cov

  analysis-core:
    name: Analysis core
    runs-on: ubuntu-latest
    # Ядро анализа (run_review.py, docreview.py, check_formal.py и их тесты
    # в корне репозитория) до 06.09.2026 не запускалось в CI ни одним шагом:
    # из двух половин проекта автоматическим гейтом была закрыта одна.
    # Пункт 12 внешнего архитектурного аудита.
    #
    # Модель здесь не вызывается и сеть не нужна: тесты ядра либо чистые
    # (сборка результата, ранжирование, разбор политики), либо подменяют
    # проходы заглушками. Проверено прогоном в чистом venv без OLLAMA_URL.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-core.txt
      - name: Install core dependencies
        run: python -m pip install -r requirements-core.txt
      - name: Test analysis core
        # Наборы ищутся маской, а не перечисляются: перечень пришлось бы
        # править при каждом новом тесте, и забытая строка сделала бы гейт
        # дырявым молча. Обратная сторона — новый тест, которому нужна сеть
        # или БД, уронит джобу; это правильное поведение для гейта, а не
        # повод вернуться к списку.
        #
        # Каждый файл запускается отдельно: тесты ядра — самостоятельные
        # скрипты (`python3 <file>`), а не pytest-набор, и один общий вызов
        # прятал бы, какой именно упал.
        run: |
          set -eu
          # nullglob и массив, а не `suites=$(ls test_*.py)`: при set -e
          # неудачный ls завершал бы скрипт ДО проверки, и сообщение ниже
          # было недостижимо (найдено на ревью). Джоба падала бы всё равно,
          # но с невнятной ошибкой ls вместо названной причины.
          shopt -s nullglob
          suites=(test_*.py)
          # Пустой список означал бы зелёную джобу, не проверившую ничего:
          # достаточно переименовать файлы, чтобы гейт замолчал.
          if (( ${#suites[@]} == 0 )); then
            echo "Не найдено ни одного test_*.py — гейт ядра ничего не проверил"
            exit 1
          fi
          for suite in "${suites[@]}"; do
            echo "::group::$suite"
            python "$suite"
            echo "::endgroup::"
          done

  frontend:
    name: Frontend and generated types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            contracts/package-lock.json
            apps/web/package-lock.json
      - name: Install contract dependencies
        run: npm --prefix contracts ci
      - name: Install frontend dependencies
        run: npm --prefix apps/web ci
      - name: Validate generated types
        run: npm --prefix contracts run check
      - name: Lint frontend
        run: npm --prefix apps/web run lint
      - name: Type-check frontend
        run: npm --prefix apps/web run typecheck
      - name: Test frontend
        run: npm --prefix apps/web run test
      - name: Build frontend
        run: npm --prefix apps/web run build
