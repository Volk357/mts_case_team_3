name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend-and-contracts:
    name: Backend and contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.lock
            contracts/requirements.lock
      - name: Install Python dependencies
        run: |
          python -m pip install -r apps/api/requirements.lock -r contracts/requirements.lock
          python -m pip install --no-deps --no-build-isolation -e apps/api
      - name: Validate JSON contract
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Lint backend
        working-directory: apps/api
        run: python -m ruff check src tests
      - name: Check backend formatting
        working-directory: apps/api
        run: python -m ruff format --check src tests
      - name: Type-check backend
        working-directory: apps/api
        run: python -m mypy
      - name: Test backend
        working-directory: apps/api
        run: python -m pytest --cov

  frontend:
    name: Frontend and generated types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            contracts/package-lock.json
            apps/web/package-lock.json
      - name: Install contract dependencies
        run: npm --prefix contracts ci
      - name: Install frontend dependencies
        run: npm --prefix apps/web ci
      - name: Validate generated types
        run: npm --prefix contracts run check
      - name: Lint frontend
        run: npm --prefix apps/web run lint
      - name: Type-check frontend
        run: npm --prefix apps/web run typecheck
      - name: Test frontend
        run: npm --prefix apps/web run test
      - name: Build frontend
        run: npm --prefix apps/web run build
