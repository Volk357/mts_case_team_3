[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "docreview-api"
version = "0.1.0"
description = "Product Application API for the DocReview platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.124,<1",
  "pydantic-settings>=2.12,<3",
  "uvicorn[standard]>=0.38,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.19,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=7,<8",
  "ruff>=0.14,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["docreview_api"]
plugins = ["pydantic.mypy"]

[tool.coverage.run]
branch = true
source = ["docreview_api"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90

