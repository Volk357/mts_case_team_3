[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "docreview-api"
version = "0.1.0"
description = "Product Application API for the DocReview platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.17,<2",
  "fastapi>=0.124,<1",
  "jsonschema>=4.23,<5",
  "pydantic-settings>=2.12,<3",
  "psycopg[binary]>=3.2,<4",
  "python-multipart>=0.0.22,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.38,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.19,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=7,<8",
  "ruff>=0.14,<1",
  "types-jsonschema>=4.23,<5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# Документация и комментарии проекта написаны по-русски. RUF002/RUF003 ловят
# «неоднозначные» кириллические буквы в докстрингах и комментариях и на таком
# тексте дают сотню срабатываний на ровном месте. RUF001 (в коде, а не в
# комментариях) намеренно оставлен включённым: там подмена латиницы кириллицей
# — настоящая ошибка.
ignore = ["RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Тесты сверяют русские сообщения пользователю дословно, поэтому кириллица
# в строковых литералах здесь законна. В коде приложения RUF001 остаётся
# включённым: там подмена латиницы кириллицей — настоящая ошибка.
"tests/**" = ["RUF001"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["docreview_api"]
plugins = ["pydantic.mypy"]

[tool.coverage.run]
branch = true
source = ["docreview_api"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
