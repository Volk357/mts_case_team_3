[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "docreview-mock-analysis-core"
version = "0.1.0"
description = "CLI-compatible mock for the DocReview Analysis Core"
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
docreview = "docreview_mock.cli:main"
docreview-mock = "docreview_mock.cli:main"

[tool.setuptools.package-data]
docreview_mock = ["profiles/*.json"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["src", "../.."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/docreview_mock/success_fixtures.py" = ["RUF001"]
"src/docreview_mock/failure_fixtures.py" = ["RUF001"]
"tests/test_cli_contract.py" = ["RUF001"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["docreview_mock"]

[tool.coverage.run]
branch = true
source = ["docreview_mock"]
omit = ["src/docreview_mock/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
