name: docreview

x-database-environment: &database-environment
  DOCREVIEW_DATABASE_URL: >-
    postgresql+psycopg://${DOCREVIEW_POSTGRES_USER:-docreview}:${DOCREVIEW_POSTGRES_PASSWORD:?Set DOCREVIEW_POSTGRES_PASSWORD in .env}@postgres:5432/${DOCREVIEW_POSTGRES_DB:-docreview}

# API and worker will reuse this dependency set when orchestration is added in
# NIK-11-06. It prevents either process from observing a partially migrated DB.
x-backend-depends-on: &backend-depends-on
  postgres:
    condition: service_healthy
  migrate:
    condition: service_completed_successfully
  storage-check:
    condition: service_completed_successfully

# API and worker share these mounts. Independent volumes keep uploaded source
# documents, Analysis Core workspaces and exported diagnostics separable for
# retention/backup purposes. The heartbeat volume lets API observe worker state.
x-backend-volumes: &backend-volumes
  - type: volume
    source: documents_data
    target: /app/data/documents
  - type: volume
    source: runs_data
    target: /app/data/runs
  - type: volume
    source: artifacts_data
    target: /app/data/artifacts
  - type: volume
    source: runtime_state
    target: /app/data/state
  - type: bind
    source: ./review-packs
    target: /app/review-packs
    read_only: true

# Real-mode services receive the ignored model configuration as a Compose
# secret. The same immutable image can therefore target a host-local Ollama or
# a remote endpoint reachable through VPN without baking addresses into it.
x-model-environment: &model-environment
  DOCREVIEW_ANALYSIS_MODEL_CONFIG_PATH: /run/secrets/model-config.yaml
  DOCREVIEW_MODEL_PREFLIGHT_TIMEOUT_SECONDS: ${DOCREVIEW_MODEL_PREFLIGHT_TIMEOUT_SECONDS:-900}

x-model-secrets: &model-secrets
  - source: model_config
    target: model-config.yaml

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${DOCREVIEW_POSTGRES_DB:-docreview}
      POSTGRES_USER: ${DOCREVIEW_POSTGRES_USER:-docreview}
      POSTGRES_PASSWORD: ${DOCREVIEW_POSTGRES_PASSWORD:?Set DOCREVIEW_POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  migrate:
    image: docreview-backend:${DOCREVIEW_BACKEND_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["migrate"]
    environment:
      <<: *database-environment
      DOCREVIEW_ENVIRONMENT: production
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  storage-check:
    image: docreview-backend:${DOCREVIEW_BACKEND_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["storage-check"]
    volumes: *backend-volumes
    restart: "no"

  model-preflight:
    image: docreview-backend:${DOCREVIEW_BACKEND_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["model-preflight"]
    profiles: ["real"]
    environment:
      <<: *model-environment
    secrets: *model-secrets
    restart: "no"

  seed-demo:
    image: docreview-backend:${DOCREVIEW_BACKEND_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["seed-demo"]
    profiles: ["demo"]
    environment:
      <<: *database-environment
      DOCREVIEW_ENVIRONMENT: demo
      DOCREVIEW_ALLOW_DEMO_SEED: "true"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

volumes:
  postgres_data:
    name: ${DOCREVIEW_POSTGRES_VOLUME:-docreview-postgres-data}
  documents_data:
    name: ${DOCREVIEW_DOCUMENTS_VOLUME:-docreview-documents}
  runs_data:
    name: ${DOCREVIEW_RUNS_VOLUME:-docreview-runs}
  artifacts_data:
    name: ${DOCREVIEW_ARTIFACTS_VOLUME:-docreview-artifacts}
  runtime_state:
    name: ${DOCREVIEW_STATE_VOLUME:-docreview-state}

secrets:
  model_config:
    file: ${DOCREVIEW_MODEL_CONFIG_FILE:-./model-config.yaml}
