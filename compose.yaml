name: docreview

x-database-environment: &database-environment
  DOCREVIEW_DATABASE_URL: >-
    postgresql+psycopg://${DOCREVIEW_POSTGRES_USER:-docreview}:${DOCREVIEW_POSTGRES_PASSWORD:?Set DOCREVIEW_POSTGRES_PASSWORD in .env}@postgres:5432/${DOCREVIEW_POSTGRES_DB:-docreview}

x-application-environment: &application-environment
  <<: *database-environment
  DOCREVIEW_ENVIRONMENT: demo
  DOCREVIEW_LOG_LEVEL: ${DOCREVIEW_LOG_LEVEL:-INFO}
  DOCREVIEW_ANALYSIS_TIMEOUT_SECONDS: ${DOCREVIEW_ANALYSIS_TIMEOUT_SECONDS:-3600}
  DOCREVIEW_PROCESS_TERMINATION_GRACE_SECONDS: 5
  DOCREVIEW_WORKER_POLL_INTERVAL_SECONDS: 1
  DOCREVIEW_WORKER_HEARTBEAT_TOLERANCE: 5
  DOCREVIEW_WORKER_STALE_AFTER_SECONDS: ${DOCREVIEW_WORKER_STALE_AFTER_SECONDS:-3660}

# API and both worker profiles reuse this dependency set so none of them can
# observe a partially migrated or unseeded database or unsafe storage mounts.
x-backend-depends-on: &backend-depends-on
  postgres:
    condition: service_healthy
  migrate:
    condition: service_completed_successfully
  storage-check:
    condition: service_completed_successfully
  seed-demo:
    condition: service_completed_successfully

# API and worker share these mounts. Independent volumes keep uploaded source
# documents, Analysis Core workspaces and exported diagnostics separable for
# retention/backup purposes. The heartbeat volume lets API observe worker state.
x-backend-volumes: &backend-volumes
  - type: volume
    source: documents_data
    target: /app/data/documents
  - type: volume
    source: runs_data
    target: /app/data/runs
  - type: volume
    source: artifacts_data
    target: /app/data/artifacts
  - type: volume
    source: runtime_state
    target: /app/data/state
  - type: bind
    source: ./review-packs
    target: /app/review-packs
    read_only: true

# Real-mode services receive the ignored model configuration as a Compose
# secret. The same immutable image can therefore target a host-local Ollama or
# a remote endpoint reachable through VPN without baking addresses into it.
x-model-environment: &model-environment
  DOCREVIEW_ANALYSIS_MODEL_CONFIG_PATH: /run/secrets/model-config.yaml
  DOCREVIEW_MODEL_PREFLIGHT_TIMEOUT_SECONDS: ${DOCREVIEW_MODEL_PREFLIGHT_TIMEOUT_SECONDS:-900}

x-model-secrets: &model-secrets
  - source: model_config
    target: model-config.yaml

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${DOCREVIEW_POSTGRES_DB:-docreview}
      POSTGRES_USER: ${DOCREVIEW_POSTGRES_USER:-docreview}
      POSTGRES_PASSWORD: ${DOCREVIEW_POSTGRES_PASSWORD:?Set DOCREVIEW_POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  migrate:
    image: docreview-backend:${DOCREVIEW_BACKEND_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["migrate"]
    environment:
      <<: *database-environment
      DOCREVIEW_ENVIRONMENT: production
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  storage-check:
    image: docreview-backend:${DOCREVIEW_BACKEND_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["storage-check"]
    volumes: *backend-volumes
    restart: "no"

  model-preflight:
    image: docreview-backend:${DOCREVIEW_BACKEND_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["model-preflight"]
    profiles: ["real"]
    environment:
      <<: *model-environment
    secrets: *model-secrets
    restart: "no"

  api:
    image: docreview-backend:${DOCREVIEW_BACKEND_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["api"]
    profiles: ["mock", "real"]
    environment:
      <<: *application-environment
      DOCREVIEW_CONTAINER_ROLE: api
    volumes: *backend-volumes
    depends_on: *backend-depends-on
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  worker:
    image: docreview-backend:${DOCREVIEW_BACKEND_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["worker"]
    profiles: ["real"]
    environment:
      <<: *application-environment
      DOCREVIEW_CONTAINER_ROLE: worker
      DOCREVIEW_ANALYSIS_EXECUTABLE: docreview
      DOCREVIEW_ANALYSIS_MODEL_CONFIG_PATH: /run/secrets/model-config.yaml
    volumes: *backend-volumes
    secrets: *model-secrets
    depends_on:
      <<: *backend-depends-on
      model-preflight:
        condition: service_completed_successfully
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 3G

  worker-mock:
    image: docreview-backend:${DOCREVIEW_BACKEND_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["worker"]
    profiles: ["mock"]
    environment:
      <<: *application-environment
      DOCREVIEW_CONTAINER_ROLE: worker
      DOCREVIEW_ANALYSIS_EXECUTABLE: docreview-mock
      DOCREVIEW_MOCK_PROFILE: demo
      DOCREVIEW_MOCK_SCENARIO: ${DOCREVIEW_MOCK_SCENARIO:-standard-12}
      DOCREVIEW_MOCK_DELAY_MS: ${DOCREVIEW_MOCK_DELAY_MS:-1200}
    volumes: *backend-volumes
    depends_on: *backend-depends-on
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  frontend:
    image: docreview-frontend:${DOCREVIEW_FRONTEND_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    profiles: ["mock", "real"]
    environment:
      DOCREVIEW_API_UPSTREAM: http://api:8000
    ports:
      - "127.0.0.1:${DOCREVIEW_HTTP_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  seed-demo:
    image: docreview-backend:${DOCREVIEW_BACKEND_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["seed-demo"]
    profiles: ["demo", "mock", "real"]
    environment:
      <<: *database-environment
      DOCREVIEW_ENVIRONMENT: demo
      DOCREVIEW_ALLOW_DEMO_SEED: "true"
      DOCREVIEW_DEMO_PACK_LOCATOR: ${DOCREVIEW_DEMO_PACK_LOCATOR:-mts-net/0.2}
    volumes:
      - type: bind
        source: ./review-packs
        target: /app/review-packs
        read_only: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

volumes:
  postgres_data:
    name: ${DOCREVIEW_POSTGRES_VOLUME:-docreview-postgres-data}
  documents_data:
    name: ${DOCREVIEW_DOCUMENTS_VOLUME:-docreview-documents}
  runs_data:
    name: ${DOCREVIEW_RUNS_VOLUME:-docreview-runs}
  artifacts_data:
    name: ${DOCREVIEW_ARTIFACTS_VOLUME:-docreview-artifacts}
  runtime_state:
    name: ${DOCREVIEW_STATE_VOLUME:-docreview-state}

secrets:
  model_config:
    file: ${DOCREVIEW_MODEL_CONFIG_FILE:-./model-config.yaml}
