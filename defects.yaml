# Таксономия дефектов технической документации
# Кейс МТС «AI-инструмент для анализа документации», команда 3
#
# Версия 0.2 — 3 сентября 2026.
# Отличие от 0.1: внесены вердикты кейсодателя по 12 замечаниям,
# выданным на документе «Описание витрины-агрегата» (прогон full).
# Из 12 замечаний: 5 подтверждены как ошибки, 2 отнесены к «требующим
# уточнения», 5 отбиты. Каждое изменение ниже помечено полем validated.
#
# focus_area — соответствие четырём областям, названным кейсодателем:
#   sources  — расположение источников и Kafka-кластеров
#   fields   — описание полей и логики их расчёта
#   filter   — описание фильтрации данных
#   volume   — описание обновления и объёма данных
#   common   — вне названных областей, но встречается
#
# severity: high | medium | low | clarification
#   high          — разработчик гарантированно вернётся с вопросом
#   medium        — вероятно уточнение на этапе разработки или тестирования
#   low           — не блокирует, но снижает качество документа
#   clarification — не ошибка, но кейсодатель согласен, что стоит дописать.
#                   Категорию ввёл сам кейсодатель формулировкой
#                   «можно пометить как требующий уточнения».
#                   Полнота и точность считаются по этой категории отдельно.
#
# detectable_by: llm | deterministic
#   Определяет, каким слоем ловится дефект. Метрики качества считаются
#   по двум классам раздельно.
#
# validated: confirmed | rejected | clarification | not_tested
#   Результат внешней разметки кейсодателем 3 сентября 2026.
#
# ВАЖНО ПРО ИЗВЛЕЧЕНИЕ ТЕКСТА.
# Два ложных срабатывания из пяти вызваны тем, что при конвертации docx
# в плоский текст теряются гиперссылки. Кейсодатель отбил замечания
# формулировкой «для таких таблиц обычно есть гиперссылки в Confluence».
# До того как чинить таксономию, нужно чинить извлечение: сохранять
# w:hyperlink и помечать объект в тексте признаком наличия ссылки.
# Иначе типы DATA_CATALOG_MISSING, DANGLING_REFERENCE и INCOMPLETE_SCHEMA
# либо шумят, либо приходится глушить их целиком — а требование
# кейсодателя «обязательна прямая ссылка на Дата-каталог» тогда
# становится непроверяемым.

# ---------------------------------------------------------------
# Соглашения компании, подтверждённые кейсодателем.
# Подставляются в промпт как явные исключения.
# ---------------------------------------------------------------
conventions:

  - id: EXTERNAL_LINKS_IN_CONFLUENCE
    rule: >
      Структура таблиц-источников, справочников и описания алгоритмов
      хранится в Confluence и подключается гиперссылкой. Отсутствие
      описания в тексте документа не является дефектом, если объект
      оформлен ссылкой.
    source: Ответ кейсодателя 03.09.2026, пункты 4 и 6.

  - id: REFERENCE_TABLES_ARE_HISTORICAL
    rule: >
      Справочные таблицы по умолчанию хранят историчность по бизнес-датам.
      Пересчёт прошлых периодов воспроизводим. Требовать отдельной оговорки
      про исторический срез справочников не нужно.
    source: Ответ кейсодателя 03.09.2026, пункт 2.

  - id: MONTHLY_MART_FULL_RELOAD
    rule: >
      Витрина-агрегат считается за текущий месяц по данным источников.
      Данные прошлых месяцев не перечитываются, бизнес-дата у каждого
      расчёта своя. Полная перезагрузка месяца без upsert не требует
      правила дедупликации и не противоречит инкрементальному способу
      загрузки.
    source: Ответ кейсодателя 03.09.2026, пункты 3 и 8.

  - id: NAMING_PLACEHOLDERS
    rule: >
      Обезличивающие имена TABLE_*, FIELD_*, SCHEMA_*, TOPIC_*, USER_*
      являются соглашением об именовании, а НЕ незаполненными заглушками.
      Требовать их замены на «реальные» значения запрещено.
      Настоящие заглушки: CLUSTER без имени, LINK_*, PROJECT-XX,
      «Папка» вместо пути.
    source: >
      Соглашение команды. Нарушение этого правила зафиксировано в прогоне
      full: замечание предлагало переименовать SCHEMA_CDM_NETS
      в SCHEMA_CDM_NETS_PROD.

defects:

  - id: DANGLING_REFERENCE
    name: Ссылка на несуществующий объект
    focus_area: fields
    severity: high
    detectable_by: llm
    validated: rejected
    description: >
      Текст ссылается на перечень, поле или справочник, которого
      в ЭТОМ ЖЕ документе нет, и объект не назван по имени в кавычках.
      Ссылка на раздел, названный в кавычках, — отдельный тип
      DANGLING_SECTION_REFERENCE, он проверяется детерминированно.
    detection_hint: >
      Обороты «этих полей», «см. выше», «указанные ниже» без последующего
      перечня. Имена полей в описательных разделах, отсутствующие
      в разделе структуры данных.
      НЕ применять, если объект оформлен гиперссылкой или сопровождается
      признаком внешней ссылки: описание живёт в Confluence, это норма.
      НЕ применять к оборотам «см. алгоритм», «см. описание» — они
      указывают на внешний документ по ссылке.
      Дефект только тогда, когда объект должен быть описан внутри
      документа и не описан, и ссылки на него нет.
    examples:
      - doc: Описание данных системы источника
        quote: "Из этих полей удаляются лидирующие нули до первого значимого символа"
        note: Перечень полей в документе отсутствует. Ссылки нет — дефект.
      - doc: Описание данных системы источника
        quote: "Для data-трафика — по полю radioAccessTechnology"
        note: Поле не описано в структуре TABLE_MSCP_RAW_KFK.
      - doc: Описание витрины-агрегата
        quote: "сначала по (lac, cell), затем fallback-логика (см. алгоритм)"
        verdict: rejected
        note: >
          ЛОЖНОЕ СРАБАТЫВАНИЕ, пункт 6. Кейсодатель: «Тут тоже есть
          гиперссылка. Не ошибка.» Ссылка потерялась при конвертации
          в плоский текст.
    comment_template: >
      В разделе «{section}» есть отсылка к {object}, но сам {object}
      в документе не приведён и ссылка на него отсутствует.
      Требуется добавить перечень или ссылку.

  - id: DANGLING_SECTION_REFERENCE
    name: Ссылка на отсутствующий раздел документа
    focus_area: fields
    severity: high
    detectable_by: deterministic
    validated: not_tested
    description: >
      Текст ссылается на раздел, названный по имени в кавычках,
      которого в документе нет.
    detection_hint: >
      Имя раздела берётся из самого текста ссылки и сверяется с заголовками
      документа с учётом синонимов шаблона. Обороты без имени раздела
      («см. выше», «см. алгоритм») к этому типу не относятся — это
      DANGLING_REFERENCE. Строка с URL рядом со ссылкой считается внешней
      ссылкой и не проверяется: описание живёт в Confluence, это норма.
    comment_template: >
      Ссылка ведёт на раздел «{object}», которого в документе нет.
      Требуется исправить ссылку или добавить раздел.

  - id: INTERNAL_CONTRADICTION
    name: Внутреннее противоречие
    focus_area: common
    severity: high
    detectable_by: llm
    validated: clarification
    description: >
      Два утверждения в одном документе прямо несовместимы.
    detection_hint: >
      Сверять продуктовые метрики с нефункциональными требованиями;
      способ загрузки с правилами обновления; регламент с глубиной данных.
      ОБЯЗАТЕЛЬНО процитировать обе стороны противоречия дословно.
      Если одну из сторон процитировать нельзя — это не противоречие,
      а неполнота, и тип не применяется.
      НЕ выводить противоречие из того, что часть случаев не описана:
      неописанный случай — это UNDEFINED_EDGE_CASE, а не конфликт.
      НЕ считать противоречием инкрементальный способ загрузки рядом
      с полной перезагрузкой месяца: см. конвенцию MONTHLY_MART_FULL_RELOAD.
    examples:
      - doc: Описание потоков данных
        quote: "Задержка: < 1 мин"
        conflicts_with: "Стриминг в реальном времени (задержка ≈ 0 сек)"
        note: Обе стороны в тексте, противоречие прямое.
      - doc: Описание витрины-агрегата
        quote: "Способ загрузки: Инкремент"
        conflicts_with: "Обновление: только полная перезагрузка месяца (без upsert)"
        verdict: clarification
        severity_override: clarification
        note: >
          Пункт 8. Кейсодатель: «См. пункт 3. Но можно пометить этот
          момент как требующий уточнения.» Не ошибка, но формулировка
          в документе допускает неверное прочтение.
      - doc: Описание витрины-агрегата
        quote: "Сопоставление с TABLE_BS_REF: приоритет: (lac, cell_id)"
        verdict: rejected
        note: >
          ЛОЖНОЕ СРАБАТЫВАНИЕ, пункт 10 в ответе кейсодателя.
          Модель объявила противоречие между «приоритет (lac, cell_id)»
          и «при lac = 0 джойн только по cell_id». Кейсодатель: «Тут
          описана логика, когда lac или cell_id не заполнен или равен
          нулю. Не ошибка.» Единственный промах, не объясняемый
          конвенциями: модель приняла ветвление за конфликт.
    comment_template: >
      Утверждение «{a}» противоречит «{b}». Разработчик выберет одно
      из двух наугад. Требуется зафиксировать целевое поведение.

  - id: INCOMPLETE_SCHEMA
    name: Структура данных описана не полностью
    focus_area: fields
    severity: high
    detectable_by: llm
    validated: rejected
    description: >
      Упомянут объект, структура полей которого не раскрыта
      и не доступна по ссылке.
    detection_hint: >
      Сопоставить список таблиц и слоёв из схемы потоков с разделом
      «Структура данных».
      НЕ применять к таблицам-источникам и справочникам, оформленным
      гиперссылкой: их структура лежит в Confluence.
      Применять в первую очередь к целевой таблице документа и к слоям,
      создаваемым этим потоком: они описываются здесь и нигде больше.
    examples:
      - doc: Описание потоков данных
        note: >
          Схема RAW → DDS → ADDS → CDM. Поля описаны только для
          TABLE_GEO_RAW_3G и TABLE_GEO_RAW_4G. Для DDS, ADDS, CDM
          структуры нет, ссылок тоже нет — дефект.
      - doc: Описание данных системы источника
        note: TABLE_MSCP_RAW_SFTP указана как приёмник, структура не описана.
      - doc: Описание витрины-агрегата
        quote: "SCHEMA_RAW | TABLE_IUM_RAW_PS | Необработанные данные по интернет-трафику (GPRS)"
        verdict: rejected
        note: >
          ЛОЖНОЕ СРАБАТЫВАНИЕ, пункт 4. Кейсодатель: «Для таких таблиц
          обычно есть гиперссылки в Confluence. Не ошибка.»
    comment_template: >
      Таблица {table} упомянута в разделе «{section}», её структура
      не описана и ссылка отсутствует. Требуется добавить перечень
      полей с типами либо ссылку на описание.

  - id: UNDEFINED_EDGE_CASE
    name: Не описана обработка граничного случая
    focus_area: fields
    severity: high
    detectable_by: llm
    validated: confirmed
    description: >
      Логика расчёта не покрывает случай отсутствия значения,
      несовпадения при join или невалидных входных данных.
    detection_hint: >
      Для каждого join — что при отсутствии соответствия.
      Для набора условий вида «если X = 0», «если Y = 0» — что при
      ОДНОВРЕМЕННОМ выполнении. Для каждого справочника — что при
      отсутствии ключа.
      Дефект только там, где комбинация условий не покрыта. Если случай
      описан хотя бы одним правилом — не применять.
    examples:
      - doc: Описание витрины-агрегата
        quote: "Находится последняя запись с ненулевыми FIELD_LAC и FIELD_CELL_ID (по FIELD_TIME_STAMP)."
        verdict: confirmed
        note: >
          ПОДТВЕРЖДЕНО, пункт 7. Инструмент предложил присвоить «Unknown».
          Кейсодатель независимо ответил: «Если lac = 0, и cell = 0,
          то поле региона заполняется как Unknown.» Формулировка совпала
          дословно. Документ прошёл ревью тремя командами, ветка осталась
          незакрытой.
      - doc: Описание витрины-агрегата
        quote: "Присоединяется FIELD_VENDOR_NAME по tac из TABLE_DEVICE_REF"
        note: >
          Не описано поведение при отсутствии tac в справочнике:
          исключать абонента, писать NULL или «Не определён».
    comment_template: >
      В шаге «{step}» не описано поведение при {condition}.
      От выбора зависят итоговые цифры витрины. Требуется уточнить.

  - id: AMBIGUOUS_LOGIC
    name: Неоднозначная формулировка логики
    focus_area: fields
    severity: high
    detectable_by: llm
    validated: not_tested
    description: >
      Правило допускает несколько прочтений: неясен порядок применения,
      приоритет условий или область действия.
    detection_hint: >
      Перечни правил без явной нумерации приоритета. Слова «приоритет»,
      «затем», «fallback» без указания порядка. Примечания, меняющие
      смысл основной таблицы.
      НЕ применять, если неоднозначность снимается соседним предложением
      или явным перечнем случаев.
    examples:
      - doc: Описание данных системы источника
        quote: "Примечание: регион sib соответствует east"
        note: >
          В таблице коррекции часового пояса Сибирь отсутствует.
          Неясно, относится ли соответствие только к часовому поясу
          или к обработке в целом.
      - doc: Описание данных системы источника
        quote: "не ранее 7 дней назад и не позже 2 часов вперёд от текущего времени"
        note: >
          Не указано, какая временная метка сравнивается:
          FIELD_CALL_START_TIME, FIELD_BIZ_DATE или время получения файла.
    comment_template: >
      Формулировка «{quote}» допускает несколько прочтений: {options}.
      Требуется однозначная формулировка.

  - id: UNSPECIFIED_FORMAT
    name: Не задана единица измерения или перечень допустимых значений
    focus_area: fields
    severity: medium
    detectable_by: llm
    validated: not_tested
    # Тип сужен после слепой разметки: в исходной широкой формулировке
    # он дал 7 бесполезных замечаний из 30 — больше любого другого типа.
    description: >
      Для КОНКРЕТНОГО поля в таблице не указана единица измерения,
      формат представления или перечень допустимых значений.
    detection_hint: >
      Применять ТОЛЬКО к строкам таблицы структуры данных, где названо
      конкретное поле, и только в трёх случаях:
      (1) поле времени без указания секунд или миллисекунд;
      (2) поле-признак или поле-код без перечня допустимых значений;
      (3) поле с числовой величиной без единицы измерения.
      НЕ применять, если тип данных поля уже указан в таблице.
      НЕ применять к разделам, заголовкам таблиц, названиям систем
      и описаниям источников.
      НЕ применять к общеизвестным отраслевым идентификаторам,
      формат которых задан стандартом.
    examples:
      - doc: Описание потоков данных
        quote: "FIELD_TIME_START long Время начала события"
        note: >
          В таблице 4G указано «Unix время», в 3G — нет.
          Единица (сек или мс) не указана ни там, ни там.
      - doc: Описание данных системы источника
        quote: "FIELD_IS_ROAMING string Признак роуминга (true/false)"
        note: >
          Тип string при булевом смысле. Не зафиксирован регистр
          и допустимые варианты написания.
    comment_template: >
      Для поля {field} не указан{a} {what}. Требуется дополнить описание.

  - id: DUPLICATE_SEMANTICS
    name: Дублирование смысла между полями
    focus_area: fields
    severity: medium
    detectable_by: llm
    validated: not_tested
    description: >
      Два поля описаны так, что разница между ними неясна.
    examples:
      - doc: Описание потоков данных
        note: >
          FIELD_RADIUS «Радиус точности (метры)» и FIELD_LOC_ACCURACY
          «Точность локации (метры)». Разница не объяснена.
    comment_template: >
      Поля {a} и {b} описаны схожим образом. Требуется пояснить различие
      или объединить.

  - id: SCHEMA_INCONSISTENCY
    name: Несогласованность схем между объектами
    focus_area: fields
    severity: medium
    detectable_by: llm
    validated: confirmed
    description: >
      Однотипные таблицы или одноимённые поля в разных местах
      описаны по-разному без объяснения. Сюда же — поле витрины,
      для которого не указан источник значения при наличии
      подходящего справочника в перечне источников.
    examples:
      - doc: Описание витрины-агрегата
        quote: "FIELD_REGION_NAME | string | Название региона"
        verdict: confirmed
        note: >
          ПОДТВЕРЖДЕНО, пункт 12. Не указано, что значение берётся
          из поля region_name таблицы TABLE_REGION_REF, хотя справочник
          присутствует в перечне источников.
      - doc: Описание потоков данных
        note: >
          TABLE_GEO_RAW_3G содержит FIELD_LOC_ACCURACY и FIELD_VENDOR,
          TABLE_GEO_RAW_4G — нет, но содержит FIELD_SERVICE_TYPE.
      - doc: между документами
        note: >
          FIELD_IMSI: string в описании потоков геоданных,
          bigint в описании системы источника.
    comment_template: >
      {object_a} и {object_b} описаны по-разному: {difference}.
      Требуется пояснить, намеренное ли это расхождение.

  - id: MISSING_SOURCE_LOCATION
    name: Не указано расположение источника или кластера
    focus_area: sources
    severity: high
    detectable_by: llm
    validated: confirmed
    description: >
      Названы топики, папки или таблицы, но не указано,
      где физически расположены кластер, стенд или путь.
    detection_hint: >
      Для каждого Kafka-топика — кластер. Для каждой SFTP-папки — путь.
      Для каждой таблицы — кластер и схема.
      ЦИТАТА обязана содержать сам незаполненный фрагмент, а не соседнюю
      строку: замечание про кластер цитирует строку с кластером.
      Соглашения об именовании SCHEMA_*, TABLE_* заглушками не считать
      (см. конвенцию NAMING_PLACEHOLDERS).
    examples:
      - doc: Описание витрины-агрегата
        quote: "Кластер: CLUSTER"
        verdict: confirmed
        note: >
          ПОДТВЕРЖДЕНО, пункт 1. Кейсодатель: «Да, ошибка.»
          Осторожно: в прогоне full это замечание было схлопнуто
          дедупликацией, а выжила версия с цитатой «Схема:
          SCHEMA_CDM_NETS» и предложением переименовать схему —
          то есть верный дефект с неверным якорем и вредным советом.
      - doc: Описание данных системы источника
        note: >
          В таблице источников колонки «SFTP-папка» и «HDFS»
          заполнены значением «Папка» либо пусты.
    comment_template: >
      Для {object} не указано {what}. Разработчик не сможет
      подключиться к источнику. Требуется дополнить.

  - id: PLACEHOLDER_LEFT
    name: Незаполненный плейсхолдер
    focus_area: common
    severity: medium
    detectable_by: deterministic
    validated: not_tested
    description: >
      В документе остались заглушки вместо реальных значений.
    detection_hint: >
      Заглушками считать: CLUSTER без имени кластера, LINK_* вместо
      ссылки, PROJECT-XX вместо номера задачи, «Папка» вместо пути,
      угловые скобки вида <Наименование шага>.
      НЕ считать заглушками TABLE_*, FIELD_*, SCHEMA_*, TOPIC_*, USER_* —
      это соглашение об обезличивании (конвенция NAMING_PLACEHOLDERS).
      Никогда не предлагать «заменить SCHEMA_X на SCHEMA_X_PROD».
    examples:
      - doc: Описание потоков данных
        note: LINK_DASHBOARD_GEO, LINK_GITLAB_PROJECT, LINK_JIRA_TASK, PROJECT-XX123
      - doc: Описание витрины-агрегата
        note: "Кластер: CLUSTER"
    comment_template: >
      В разделе «{section}» осталась заглушка {placeholder}.
      Требуется заменить на реальное значение.

  - id: FILTER_RESULT_UNDEFINED
    name: Не описана судьба отфильтрованных записей
    focus_area: filter
    severity: high
    detectable_by: llm
    validated: not_tested
    description: >
      Задано правило фильтрации, но не сказано, что происходит
      с записями, не прошедшими фильтр.
    examples:
      - doc: Описание данных системы источника
        quote: "Учитываются только события, произошедшие не ранее 7 дней назад"
        note: >
          Не описано: отбрасываются, помещаются в карантин,
          логируются или загружаются с признаком.
    comment_template: >
      Задано правило фильтрации «{rule}», но не описано, что происходит
      с отсеянными записями. Требуется уточнить.

  - id: NO_FILTER_DESCRIPTION
    name: Фильтрация не описана вовсе
    focus_area: filter
    severity: high
    detectable_by: deterministic
    validated: confirmed
    # severity поднят с medium: кейсодатель подтвердил как ошибку.
    description: >
      В документе отсутствует описание правил отбора входных данных,
      хотя алгоритм предполагает отбор по периоду или условию.
    detection_hint: >
      Проверять, описано ли, по какому полю и как отбирается период;
      описаны ли условия исключения записей.
      Раздел, помеченный «не применимо», дефектом не считать.
    examples:
      - doc: Описание витрины-агрегата
        quote: "Берутся все уникальные FIELD_IMSI из: TABLE_IUM_RAW_MS (SMS + звонки) TABLE_IUM_RAW_PS (GPRS) за период: FIELD_BIZ_DATE (месяц)."
        verdict: confirmed
        note: >
          ПОДТВЕРЖДЕНО, пункт 11. Кейсодатель: «Да, это ошибка.»
          Не описано, по какому полю и как отбирается период.
      - doc: Описание потоков данных
        note: >
          Правила фильтрации входящих событий не описаны.
          Не сказано, обрабатываются ли события без координат.
    comment_template: >
      Не описаны правила отбора входных данных для {object}.
      Требуется указать поле и условие фильтрации.

  - id: NO_DEDUP_OR_KEY
    name: Не задан ключ, гранулярность или правило дедупликации
    focus_area: fields
    severity: high
    detectable_by: llm
    validated: rejected
    description: >
      Не зафиксирована уникальность строки в целевой таблице
      и правило разрешения дублей.
    detection_hint: >
      Применять там, где заявлен upsert, инкремент с пересечением окон,
      слияние нескольких источников в одну таблицу или поток событий,
      где дубли возможны технически.
      НЕ применять к витрине, которая полностью перезагружает свой период
      и имеет уникальную бизнес-дату у каждого расчёта:
      см. конвенцию MONTHLY_MART_FULL_RELOAD.
    examples:
      - doc: Описание данных системы источника
        note: >
          Для CDR не описано правило обработки дублей,
          хотя дублирование CDR типично.
      - doc: Описание витрины-агрегата
        quote: "Обновление | Только полная перезагрузка месяца (без upsert)"
        verdict: rejected
        note: >
          ЛОЖНОЕ СРАБАТЫВАНИЕ, пункт 3. Кейсодатель: «Витрина обновляется
          раз в месяц на данных из источников. За прошлый месяц данные
          не берутся. Т.е. бизнес дата будет уже другая. Не ошибка.»
    comment_template: >
      Для {table} не зафиксирован{a} {what}. Требуется указать явно.

  - id: NO_VOLUME_ESTIMATE
    name: Не указан объём данных
    focus_area: volume
    severity: medium
    detectable_by: llm
    validated: not_tested
    description: >
      Отсутствует оценка объёма: строк в сутки, размера партиции,
      прироста хранилища.
    examples:
      - doc: Описание потоков данных
        note: >
          Указана пропускная способность 100 000 событий/сек,
          но объём хранения и размер партиции не оценены.
      - doc: Описание витрины-агрегата
        note: Ожидаемое количество строк в месячном срезе не указано.
    comment_template: >
      Не указан ожидаемый объём данных для {object}.
      Требуется для планирования ресурсов.

  - id: NO_SCHEDULE
    name: Не указан регламент обновления
    focus_area: volume
    severity: clarification
    detectable_by: llm
    validated: clarification
    # severity понижен с medium до clarification: кейсодатель назвал
    # частоту («каждое первое число месяца»), но согласился, что в
    # документе её стоит зафиксировать.
    description: >
      Указана частота, но не указано число, время запуска
      или окно обработки.
    examples:
      - doc: Описание витрины-агрегата
        quote: "Регламент: Ежемесячно (1 раз в месяц)"
        verdict: clarification
        note: >
          Пункт 9. Кейсодатель: «Обновление — каждое первое число месяца.
          Можно пометить как требующий уточнения.»
      - doc: Описание данных системы источника
        note: Частота и регламент загрузки не указаны вовсе.
    comment_template: >
      Для {object} указана частота, но не указано {what}.
      Стоит зафиксировать в документе.

  - id: RETENTION_GAP
    name: Срок хранения указан не для всех слоёв
    focus_area: volume
    severity: low
    detectable_by: llm
    validated: not_tested
    examples:
      - doc: Описание потоков данных
        quote: "Хранение: Kafka — 24 ч, RAW-слой — 30 дней"
        note: Для DDS, ADDS, CDM срок хранения не указан.
    comment_template: >
      Срок хранения указан для {covered}, но не для {missing}.

  - id: TIMEZONE_UNDEFINED
    name: Часовой пояс не назван
    focus_area: fields
    severity: high
    detectable_by: deterministic
    validated: confirmed
    description: >
      Поле «Часовой пояс» не называет конкретный пояс
      (значение вида «местное время региона»), из-за чего границы
      периода нетрактуемы.
    detection_hint: >
      Проверять значение поля «Часовой пояс»: должно быть конкретное
      обозначение (UTC, смещение, зона IANA).
  - id: TIMEZONE_INCONSISTENT
    name: Трактовка часового пояса расходится между разделами
    focus_area: fields
    severity: high
    detectable_by: llm
    validated: confirmed
    description: >
      Конкретный пояс назван, но разделы трактуют границы периода
      в разных поясах, либо не сказано, какое поле несёт метку смещения.
    detection_hint: >
      Сверять объявленный часовой пояс требований с поясом в правилах
      фильтрации и с наличием коррекции на локальные пояса в источниках.
      Проверять, указано ли, какое поле несёт метку смещения.
    examples:
      - doc: Описание витрины-агрегата
        quote: "FIELD_BIZ_DATE | date | Бизнес-дата (1-е число месяца, за который формируется агрегат)"
        verdict: confirmed
        note: >
          ПОДТВЕРЖДЕНО, пункт 5. Кейсодатель: «Да, тут нужно уточнять.
          Обычно у нас есть поля, которые содержат актуальную метку
          смещения на часовой пояс.» Замечание должно требовать указать
          конкретное поле со смещением, а не просто «зафиксировать пояс».
    comment_template: >
      Не указано, в каком часовом поясе {what} и какое поле несёт метку
      смещения. Требуется зафиксировать.

  - id: PII_NO_PROTECTION
    name: Персональные данные без требований к защите
    focus_area: common
    severity: medium
    detectable_by: llm
    validated: not_tested
    description: >
      В структуре присутствуют идентификаторы абонента,
      требования к маскированию или доступу не описаны.
    examples:
      - doc: Описание потоков данных
        note: >
          FIELD_IMSI, FIELD_MSISDN, FIELD_IMEI хранятся в RAW-слое
          в открытом виде. Требования к маскированию и разграничению
          доступа не описаны.
    comment_template: >
      В {table} присутствуют идентификаторы абонента: {fields}.
      Требования к защите не описаны.

  - id: TEXT_STRUCTURE_ERROR
    name: Ошибка изложения в алгоритме
    focus_area: fields
    severity: low
    detectable_by: llm
    validated: not_tested
    description: >
      Формальная ошибка в записи алгоритма, не мешающая понять замысел,
      но требующая правки.
    examples:
      - doc: Описание витрины-агрегата
        quote: "Группировка по: FIELD_REGION_NAME, FIELD_VENDOR_NAME, FIELD_USERS_CNT"
        note: >
          FIELD_USERS_CNT указано в списке группировки,
          хотя является агрегатом.
      - doc: Описание витрины-агрегата
        note: "Шаг 5 «Запись в CDM» объявлен, но не описан."
    comment_template: >
      В шаге «{step}» {problem}. Требуется поправить формулировку.

  # -------------------------------------------------------------
  # Типы, добавленные из документа «Основные моменты документации»
  # -------------------------------------------------------------

  - id: SERIALIZATION_UNSPECIFIED
    name: Не указана модель сериализации потока
    focus_area: sources
    severity: high
    detectable_by: deterministic
    validated: not_tested
    description: >
      Для входного или выходного потока не указана модель данных:
      формат, схема, тип сериализации и десериализации.
    detection_hint: >
      Проверять таблицы «Источники данных» и «Приемники данных»:
      колонка «Сериализация» должна быть заполнена для каждой строки.
      Для файловых источников — формат файла и способ разбора.
    examples:
      - doc: Описание данных системы источника
        quote: "Источники (CDR в формате CSV, сжатые gzip)"
        note: >
          Формат назван, но схема и способ десериализации не описаны:
          разделитель, наличие заголовка, кодировка.
    comment_template: >
      Для {object} не указана модель сериализации: {what}.
      Требование кейсодателя №1. Требуется дополнить.

  - id: REFERENCE_LIST_MISSING
    name: Нет перечня используемых справочников
    focus_area: fields
    severity: medium
    detectable_by: llm
    validated: not_tested
    description: >
      В описании витрины отсутствует перечень нормативно-справочной
      информации, используемой при расчёте.
    detection_hint: >
      Собрать справочники, упомянутые в алгоритме, и проверить, есть ли
      в документе их сводный перечень с назначением каждого.
      Наличие справочников в общем списке источников без указания роли
      в расчёте перечнем НСИ не считается.
    examples:
      - doc: Описание витрины-агрегата
        note: >
          В расчёте используются TABLE_BS_REF, TABLE_REGION_REF,
          TABLE_DEVICE_REF. Отдельного перечня НСИ с назначением
          каждого справочника нет.
    comment_template: >
      В описании витрины {table} не приведён перечень используемых
      справочников. Требование кейсодателя №8. Требуется дополнить.

  # -------------------------------------------------------------
  # Формальные проверки. Ловятся кодом без модели.
  # -------------------------------------------------------------

  - id: TEMPLATE_SECTION_MISSING
    name: Раздел шаблона удалён, а не помечен «не применимо»
    focus_area: common
    severity: medium
    detectable_by: deterministic
    validated: not_tested
    description: >
      Раздел официального шаблона отсутствует в документе.
      Правило кейсодателя: при отсутствии этапа обработки раздел
      сохраняется и помечается формулировкой «не применимо».
    detection_hint: >
      Сверять заголовки документа с перечнем разделов шаблона
      «Потоковые данные/витрины». Раздел с пометкой «не применимо» —
      норма, не дефект.
      Кейсодатель подтвердил 03.09.2026, что шаблон единый для потоков
      и витрин: алгоритм обработки витрины относится к разделу
      «Алгоритм обработки потока», партиционирование HDFS —
      к разделу «Формирование ключа (kafka) / партиции (hdfs)».
    comment_template: >
      Раздел шаблона «{section}» отсутствует. Требование кейсодателя №5:
      разделы сохраняются, неприменимые помечаются «не применимо».

  - id: NULLABILITY_UNSPECIFIED
    name: Не указан признак обязательности поля
    focus_area: fields
    severity: medium
    detectable_by: deterministic
    validated: not_tested
    description: >
      Для поля витрины не указан признак NOT NULL / NULLABLE.
    detection_hint: >
      Проверять каждую строку таблицы структуры данных приёмника
      на наличие признака обязательности.
    examples:
      - doc: Описание витрины-агрегата
        note: >
          Ни для одного из пяти полей TABLE_AGG_DEVICES признак
          обязательности не указан.
    comment_template: >
      Для поля {field} не указан признак обязательности
      (NOT NULL / NULLABLE). Требование кейсодателя №3.

  - id: DATA_CATALOG_MISSING
    name: Нет прямой ссылки на Дата-каталог
    focus_area: sources
    severity: high
    detectable_by: deterministic
    validated: not_tested
    description: >
      В документе отсутствует прямая ссылка на Дата-каталог.
    detection_hint: >
      Работает только при сохранении гиперссылок на этапе извлечения
      текста. На плоском тексте без ссылок проверка не применяется.
    examples:
      - doc: Описание витрины-агрегата
        note: Раздел Data Catalog отсутствует, ссылки нет.
    comment_template: >
      В документе нет прямой ссылки на Дата-каталог.
      Требование кейсодателя №2.

  - id: HDFS_PATH_INCOMPLETE
    name: Путь HDFS без указания формата
    focus_area: sources
    severity: medium
    detectable_by: deterministic
    validated: not_tested
    description: >
      Для файлового хранилища не указан полный путь в HDFS
      либо не указан формат хранения по этому пути.
    examples:
      - doc: Описание данных системы источника
        quote: "Папка"
        note: >
          Колонки «SFTP-папка» и «HDFS» заполнены словом «Папка»:
          ни пути, ни формата.
    comment_template: >
      Для {object} не указан полный путь в HDFS с форматом хранения.
      Требование кейсодателя №7.

  - id: VAGUE_WORDING
    name: Расплывчатая формулировка (лазейка / незакрытый перечень)
    focus_area: text
    severity: low
    detectable_by: deterministic
    validated: not_tested
    description: >
      Формулировка снижает проверяемость требования: лазейка («по возможности»,
      «при необходимости») или незакрытый перечень («и т.д.», «и другие»).
      Добор покрытия по внешним таксономиям (Femmer requirements smells: Loopholes,
      Open-ended Non-verifiable Terms). Словарь в template.yaml, только словари с
      0 измеренных FP И без легитимного омонима. Superlative/comparative дают
      измеренный FP; subjective/universal/temporal — 0 FP, но омоним; идиома
      «включая, но не ограничиваясь» — нужен синтаксис. Все в бэклоге
      (probe_smells.py, taxonomy_coverage.md).
    examples:
      - doc: Алгоритм обработки потока
        quote: "Данные обновляются по возможности."
        note: >
          «по возможности» — лазейка: регламент обновления не определён.
    comment_template: >
      Формулировка для {object} расплывчата (лазейка или незакрытый перечень) и
      снижает проверяемость. Заменить на конкретное измеримое условие или полный
      перечень.

# ---------------------------------------------------------------
# Выведенные из таксономии типы.
# Не подставляются в промпт. Сохранены для истории решений.
# ---------------------------------------------------------------
retired_defects:

  - id: BACKFILL_REFERENCE_HISTORY
    name: Историчность справочников не учтена при загрузке истории
    retired_at: 2026-09-03
    reason: >
      Отбит кейсодателем. Пункт 2 разметки: «Справочные данные имеют
      под собой историчность по бизнес-датам. Поэтому пересчитывать
      какие-то данные мы можем. Тут ошибки нет.»
      Историчность справочников — умолчание компании, оговаривать
      её в документе не требуется. См. конвенцию
      REFERENCE_TABLES_ARE_HISTORICAL.
    note: >
      Тип был флагманским примером в промежуточных материалах
      от 4 сентября. Материалы требуют правки: пример должен быть
      заменён на UNDEFINED_EDGE_CASE (незакрытая ветка определения
      региона) и TIMEZONE_UNDEFINED — оба подтверждены кейсодателем.

