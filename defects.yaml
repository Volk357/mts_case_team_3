# Таксономия дефектов технической документации
# Кейс МТС «AI-инструмент для анализа документации», команда 3
# Версия 0.1 — собрана из 3 примеров ТЗ, до созвона с кейсодателем
#
# focus_area — соответствие четырём областям, названным кейсодателем:
#   sources  — расположение источников и Kafka-кластеров
#   fields   — описание полей и логики их расчёта
#   filter   — описание фильтрации данных
#   volume   — описание обновления и объёма данных
#   common   — вне названных областей, но встречается
#
# severity: high | medium | low
#   high   — разработчик гарантированно вернётся с вопросом
#   medium — вероятно уточнение на этапе разработки или тестирования
#   low    — не блокирует, но снижает качество документа

defects:

  - id: DANGLING_REFERENCE
    name: Ссылка на несуществующий объект
    focus_area: fields
    severity: high
    description: >
      Текст ссылается на перечень, поле, справочник или раздел,
      которого в документе нет.
    detection_hint: >
      Обороты «этих полей», «см. выше», «см. алгоритм», «указанные ниже»
      без последующего перечня. Имена полей в описательных разделах,
      отсутствующие в разделе структуры данных.
    examples:
      - doc: Описание данных системы источника
        quote: "Из этих полей удаляются лидирующие нули до первого значимого символа"
        note: Перечень полей в документе отсутствует.
      - doc: Описание данных системы источника
        quote: "Для data-трафика — по полю radioAccessTechnology"
        note: Поле не описано в структуре TABLE_MSCP_RAW_KFK.
      - doc: Описание данных системы источника
        quote: "Определяется по FIELD_OL_SERVICE_TYPE (см. выше)"
        note: Справочник допустимых значений не приведён.
    comment_template: >
      В разделе «{section}» есть отсылка к {object}, но сам {object}
      в документе не приведён. Разработчик не сможет реализовать логику
      без уточнения. Требуется добавить перечень.

  - id: INTERNAL_CONTRADICTION
    name: Внутреннее противоречие
    focus_area: common
    severity: high
    description: >
      Два утверждения в одном документе несовместимы.
    detection_hint: >
      Сверять продуктовые метрики с нефункциональными требованиями;
      способ загрузки с правилами обновления; регламент с глубиной данных.
    examples:
      - doc: Описание витрины-агрегата
        quote: "Способ загрузки: Инкремент"
        conflicts_with: "Обновление: только полная перезагрузка месяца (без upsert)"
      - doc: Описание потоков данных
        quote: "Задержка: < 1 мин"
        conflicts_with: "Стриминг в реальном времени (задержка ≈ 0 сек)"
      - doc: Описание потоков данных
        quote: "Инкрементная загрузка по часовым партициям"
        conflicts_with: "Стриминг в реальном времени"
    comment_template: >
      Утверждение «{a}» противоречит «{b}». Разработчик выберет одно
      из двух наугад. Требуется зафиксировать целевое поведение.

  - id: INCOMPLETE_SCHEMA
    name: Структура данных описана не полностью
    focus_area: fields
    severity: high
    description: >
      В схеме потока или в перечне приёмников упомянут объект,
      структура полей которого не раскрыта.
    detection_hint: >
      Сопоставить список таблиц/слоёв из схемы потоков с разделом
      «Структура данных». Каждая упомянутая таблица должна иметь описание полей.
    examples:
      - doc: Описание потоков данных
        note: >
          Схема RAW → DDS → ADDS → CDM. Поля описаны только для
          TABLE_GEO_RAW_3G и TABLE_GEO_RAW_4G. Для DDS, ADDS, CDM структуры нет.
      - doc: Описание данных системы источника
        note: TABLE_MSCP_RAW_SFTP указана как приёмник, структура не описана.
      - doc: Описание витрины-агрегата
        note: >
          В алгоритме используются FIELD_LAC, FIELD_CELL_ID, FIELD_TIME_STAMP,
          FIELD_CELL_GEN, tac, region_code. Ни одно исходное поле не описано.
    comment_template: >
      Таблица {table} упомянута в разделе «{section}», но её структура
      не описана. Требуется добавить перечень полей с типами.

  - id: UNDEFINED_EDGE_CASE
    name: Не описана обработка граничного случая
    focus_area: fields
    severity: high
    description: >
      Логика расчёта не покрывает случай отсутствия значения,
      несовпадения при join или невалидных входных данных.
    detection_hint: >
      Для каждого join — что при отсутствии соответствия.
      Для каждого условия вида «если X = 0» — что при одновременном
      выполнении нескольких условий. Для каждого справочника —
      что при отсутствии ключа.
    examples:
      - doc: Описание витрины-агрегата
        quote: "если lac = 0 → джойн только по cell_id (4G)"
        note: Не описано поведение при одновременном lac = 0 и cell = 0.
      - doc: Описание витрины-агрегата
        quote: "Присоединяется FIELD_VENDOR_NAME по tac из TABLE_DEVICE_REF"
        note: >
          Не описано поведение при отсутствии tac в справочнике:
          исключать абонента, писать NULL или «Не определён».
      - doc: Описание витрины-агрегата
        note: >
          Не описано, попадает ли в витрину абонент, для которого
          регион определить не удалось.
    comment_template: >
      В шаге «{step}» не описано поведение при {condition}.
      От выбора зависят итоговые цифры витрины. Требуется уточнить.

  - id: AMBIGUOUS_LOGIC
    name: Неоднозначная формулировка логики
    focus_area: fields
    severity: high
    description: >
      Правило допускает несколько прочтений: неясен порядок применения,
      приоритет условий или область действия.
    detection_hint: >
      Перечни правил без явной нумерации приоритета. Слова
      «приоритет», «затем», «fallback» без указания порядка.
      Примечания, меняющие смысл основной таблицы.
    examples:
      - doc: Описание данных системы источника
        quote: "Примечание: регион sib соответствует east"
        note: >
          В таблице коррекции часового пояса Сибирь отсутствует.
          Неясно, относится ли соответствие только к часовому поясу
          или к обработке в целом.
      - doc: Описание витрины-агрегата
        note: >
          Шаг 3: перечень правил join задан списком без явного порядка
          применения. Неясно, какое правило применяется первым.
      - doc: Описание данных системы источника
        quote: "не ранее 7 дней назад и не позже 2 часов вперёд от текущего времени"
        note: >
          Не указано, какая временная метка сравнивается:
          FIELD_CALL_START_TIME, FIELD_BIZ_DATE или время получения файла.
    comment_template: >
      Формулировка «{quote}» допускает несколько прочтений: {options}.
      Требуется однозначная формулировка.

  - id: UNSPECIFIED_FORMAT
    name: Не задан формат, единица измерения или домен значений
    focus_area: fields
    severity: medium
    description: >
      Поле описано без указания формата, единицы измерения
      или перечня допустимых значений.
    detection_hint: >
      Поля времени — секунды или миллисекунды. Поля-признаки —
      перечень допустимых значений. Поля-сдвиги — единица измерения.
      Поля расстояния — единица измерения.
    examples:
      - doc: Описание потоков данных
        quote: "FIELD_TIME_START long Время начала события"
        note: >
          В таблице 4G указано «Unix время», в 3G — нет.
          Единица (сек или мс) не указана ни там, ни там.
      - doc: Описание данных системы источника
        quote: "FIELD_IS_ROAMING string Признак роуминга (true/false)"
        note: >
          Тип string при булевом смысле. Не зафиксирован регистр
          и допустимые варианты написания.
      - doc: Описание данных системы источника
        quote: "FIELD_TIME_ZONE_SHIFT string Сдвиг часового пояса"
        note: >
          Формат не задан. Рядом FIELD_TIMEZONE_CALC int в минутах,
          связь между полями не описана.
    comment_template: >
      Для поля {field} не указан{a} {what}. Требуется дополнить описание.

  - id: DUPLICATE_SEMANTICS
    name: Дублирование смысла между полями
    focus_area: fields
    severity: medium
    description: >
      Два поля описаны так, что разница между ними неясна.
    examples:
      - doc: Описание потоков данных
        note: >
          FIELD_RADIUS «Радиус точности (метры)» и FIELD_LOC_ACCURACY
          «Точность локации (метры)». Разница не объяснена.
    comment_template: >
      Поля {a} и {b} описаны схожим образом. Требуется пояснить различие
      или объединить.

  - id: SCHEMA_INCONSISTENCY
    name: Несогласованность схем между объектами
    focus_area: fields
    severity: medium
    description: >
      Однотипные таблицы или одноимённые поля в разных местах
      описаны по-разному без объяснения.
    examples:
      - doc: Описание потоков данных
        note: >
          TABLE_GEO_RAW_3G содержит FIELD_LOC_ACCURACY и FIELD_VENDOR,
          TABLE_GEO_RAW_4G — нет, но содержит FIELD_SERVICE_TYPE.
          Расхождение не объяснено.
      - doc: между документами
        note: >
          FIELD_IMSI: string в описании потоков геоданных,
          bigint в описании системы источника.
    comment_template: >
      {object_a} и {object_b} описаны по-разному: {difference}.
      Требуется пояснить, намеренное ли это расхождение.

  - id: MISSING_SOURCE_LOCATION
    name: Не указано расположение источника или кластера
    focus_area: sources
    severity: high
    description: >
      Названы топики, папки или таблицы, но не указано,
      где физически расположены кластер, стенд или путь.
    detection_hint: >
      Для каждого Kafka-топика — кластер. Для каждой SFTP-папки — путь.
      Для каждой таблицы — кластер и схема.
    examples:
      - doc: Описание данных системы источника
        note: >
          В таблице источников колонки «SFTP-папка» и «HDFS»
          заполнены значением «Папка» либо пусты.
      - doc: Описание потоков данных
        note: >
          Перечислены 14 топиков по регионам, кластер Kafka не указан.
    comment_template: >
      Для {object} не указано {what}. Разработчик не сможет
      подключиться к источнику. Требуется дополнить.

  - id: PLACEHOLDER_LEFT
    name: Незаполненный плейсхолдер
    focus_area: common
    severity: medium
    description: >
      В документе остались заглушки вместо реальных значений.
    detection_hint: >
      Строки вида LINK_*, PROJECT-XX, CLUSTER, SCHEMA_*,
      обобщённые значения «Папка», USER_A.
    examples:
      - doc: Описание потоков данных
        note: LINK_DASHBOARD_GEO, LINK_GITLAB_PROJECT, LINK_JIRA_TASK, PROJECT-XX123
      - doc: Описание витрины-агрегата
        note: "Кластер: CLUSTER"
    comment_template: >
      В разделе «{section}» осталась заглушка {placeholder}.
      Требуется заменить на реальное значение.

  - id: FILTER_RESULT_UNDEFINED
    name: Не описана судьба отфильтрованных записей
    focus_area: filter
    severity: high
    description: >
      Задано правило фильтрации, но не сказано, что происходит
      с записями, не прошедшими фильтр.
    examples:
      - doc: Описание данных системы источника
        quote: "Учитываются только события, произошедшие не ранее 7 дней назад"
        note: >
          Не описано: отбрасываются, помещаются в карантин,
          логируются или загружаются с признаком.
    comment_template: >
      Задано правило фильтрации «{rule}», но не описано, что происходит
      с отсеянными записями. Требуется уточнить.

  - id: NO_FILTER_DESCRIPTION
    name: Фильтрация не описана вовсе
    focus_area: filter
    severity: medium
    description: >
      В документе отсутствует раздел о фильтрации входных данных,
      хотя поток предполагает отбор.
    examples:
      - doc: Описание потоков данных
        note: >
          Правила фильтрации входящих событий не описаны.
          Не сказано, обрабатываются ли события без координат.
    comment_template: >
      В документе не описаны правила фильтрации входных данных.
      Требуется добавить раздел.

  - id: NO_DEDUP_OR_KEY
    name: Не задан ключ, гранулярность или правило дедупликации
    focus_area: fields
    severity: high
    description: >
      Не зафиксирована уникальность строки в целевой таблице
      и правило разрешения дублей.
    examples:
      - doc: Описание витрины-агрегата
        note: >
          Гранулярность (BIZ_DATE, REGION, VENDOR) следует из алгоритма,
          но явно не зафиксирована.
      - doc: Описание данных системы источника
        note: >
          Для CDR не описано правило обработки дублей,
          хотя дублирование CDR типично.
    comment_template: >
      Для {table} не зафиксирован{a} {what}. Требуется указать явно.

  - id: NO_VOLUME_ESTIMATE
    name: Не указан объём данных
    focus_area: volume
    severity: medium
    description: >
      Отсутствует оценка объёма: строк в сутки, размера партиции,
      прироста хранилища.
    examples:
      - doc: Описание потоков данных
        note: >
          Указана пропускная способность 100 000 событий/сек,
          но объём хранения и размер партиции не оценены.
      - doc: Описание витрины-агрегата
        note: Ожидаемое количество строк в месячном срезе не указано.
    comment_template: >
      Не указан ожидаемый объём данных для {object}.
      Требуется для планирования ресурсов.

  - id: NO_SCHEDULE
    name: Не указан регламент обновления
    focus_area: volume
    severity: medium
    description: >
      Не указана частота, время запуска или окно обработки.
    examples:
      - doc: Описание данных системы источника
        note: Частота и регламент загрузки не указаны.
      - doc: Описание витрины-агрегата
        note: >
          Указано «ежемесячно», но не указано, какого числа
          запускается расчёт.
    comment_template: >
      Для {object} не указан{a} {what} обновления. Требуется уточнить.

  - id: RETENTION_GAP
    name: Срок хранения указан не для всех слоёв
    focus_area: volume
    severity: low
    examples:
      - doc: Описание потоков данных
        quote: "Хранение: Kafka — 24 ч, RAW-слой — 30 дней"
        note: Для DDS, ADDS, CDM срок хранения не указан.
    comment_template: >
      Срок хранения указан для {covered}, но не для {missing}.

  - id: BACKFILL_REFERENCE_HISTORY
    name: Историчность справочников не учтена при загрузке истории
    focus_area: volume
    severity: high
    description: >
      Требуется загрузка исторических данных, но не указано,
      используется ли актуальный или исторический срез справочников.
    examples:
      - doc: Описание витрины-агрегата
        quote: "Глубина данных: с 01.05.2023. Обязательно загрузить исторические данные"
        note: >
          Алгоритм использует TABLE_BS_REF, TABLE_DEVICE_REF, TABLE_REGION_REF.
          Не указано, историчны ли справочники. При использовании актуального
          среза пересчёт прошлых месяцев даст неверный регион и вендора,
          а повторный пересчёт того же месяца — другой результат.
    comment_template: >
      При загрузке истории с {date} используются справочники {refs}.
      Не указано, применяется ли исторический срез. От этого зависит
      воспроизводимость результата. Требуется уточнить.

  - id: TIMEZONE_UNDEFINED
    name: Часовой пояс не определён или несогласован
    focus_area: fields
    severity: high
    description: >
      Не указано, в каком поясе трактуются границы периода,
      либо трактовка расходится между документами.
    examples:
      - doc: Описание витрины-агрегата
        quote: "Часовой пояс: UTC"
        note: >
          В описании системы источника выполняется коррекция
          на локальные пояса регионов. Не указано, в каком поясе
          определяется граница календарного месяца.
    comment_template: >
      Не указано, в каком часовом поясе {what}. Требуется зафиксировать.

  - id: PII_NO_PROTECTION
    name: Персональные данные без требований к защите
    focus_area: common
    severity: medium
    description: >
      В структуре присутствуют идентификаторы абонента,
      требования к маскированию или доступу не описаны.
    examples:
      - doc: Описание потоков данных
        note: >
          FIELD_IMSI, FIELD_MSISDN, FIELD_IMEI хранятся в RAW-слое
          в открытом виде. Требования к маскированию и разграничению
          доступа не описаны.
    comment_template: >
      В {table} присутствуют идентификаторы абонента: {fields}.
      Требования к защите не описаны.

  - id: TEXT_STRUCTURE_ERROR
    name: Ошибка изложения в алгоритме
    focus_area: fields
    severity: low
    description: >
      Формальная ошибка в записи алгоритма, не мешающая понять замысел,
      но требующая правки.
    examples:
      - doc: Описание витрины-агрегата
        quote: "Группировка по: FIELD_REGION_NAME, FIELD_VENDOR_NAME, FIELD_USERS_CNT"
        note: >
          FIELD_USERS_CNT указано в списке группировки,
          хотя является агрегатом.
    comment_template: >
      В шаге «{step}» {problem}. Требуется поправить формулировку.

# ---------------------------------------------------------------
# Открытые вопросы к кейсодателю (уточнить на созвоне)
# ---------------------------------------------------------------
open_questions:
  - Какие из перечисленных типов реально приводят к возврату ТЗ, а какие
    считаются нормой и обсуждаются устно без правки документа?
  - Есть ли типы дефектов, не попавшие в этот список?
  - Существует ли шаблон ТЗ отдельным файлом, или структура выводится
    из примеров?
  - Приемлемо ли для аналитика 5–10 замечаний на документ,
    или порог ниже?
