defects:
- id: DANGLING_REFERENCE
  name: Ссылка на несуществующий объект
  focus_area: fields
  severity: high
  description: 'Текст ссылается на перечень, поле, справочник или раздел, которого в ЭТОМ ЖЕ документе
    нет.

    '
  detection_hint: 'Обороты «этих полей», «см. выше», «указанные ниже» без последующего перечня. Имена
    полей в описательных разделах, отсутствующие в разделе структуры данных. НЕ применять, если объект
    оформлен гиперссылкой или сопровождается признаком внешней ссылки: описание живёт в Confluence, это
    норма. НЕ применять к оборотам «см. алгоритм», «см. описание» — они указывают на внешний документ
    по ссылке. Дефект только тогда, когда объект должен быть описан внутри документа и не описан, и ссылки
    на него нет.

    '
- id: INTERNAL_CONTRADICTION
  name: Внутреннее противоречие
  focus_area: common
  severity: high
  description: 'Два утверждения в одном документе прямо несовместимы.

    '
  detection_hint: 'Сверять продуктовые метрики с нефункциональными требованиями; способ загрузки с правилами
    обновления; регламент с глубиной данных. ОБЯЗАТЕЛЬНО процитировать обе стороны противоречия дословно.
    Если одну из сторон процитировать нельзя — это не противоречие, а неполнота, и тип не применяется.
    НЕ выводить противоречие из того, что часть случаев не описана: неописанный случай — это UNDEFINED_EDGE_CASE,
    а не конфликт. НЕ считать противоречием инкрементальный способ загрузки рядом с полной перезагрузкой
    месяца: см. конвенцию MONTHLY_MART_FULL_RELOAD.

    '
- id: INCOMPLETE_SCHEMA
  name: Структура данных описана не полностью
  focus_area: fields
  severity: high
  description: 'Упомянут объект, структура полей которого не раскрыта и не доступна по ссылке.

    '
  detection_hint: 'Сопоставить список таблиц и слоёв из схемы потоков с разделом «Структура данных». НЕ
    применять к таблицам-источникам и справочникам, оформленным гиперссылкой: их структура лежит в Confluence.
    Применять в первую очередь к целевой таблице документа и к слоям, создаваемым этим потоком: они описываются
    здесь и нигде больше.

    '
- id: UNDEFINED_EDGE_CASE
  name: Не описана обработка граничного случая
  focus_area: fields
  severity: high
  description: 'Логика расчёта не покрывает случай отсутствия значения, несовпадения при join или невалидных
    входных данных.

    '
  detection_hint: 'Для каждого join — что при отсутствии соответствия. Для набора условий вида «если X
    = 0», «если Y = 0» — что при ОДНОВРЕМЕННОМ выполнении. Для каждого справочника — что при отсутствии
    ключа. Дефект только там, где комбинация условий не покрыта. Если случай описан хотя бы одним правилом
    — не применять.

    '
- id: AMBIGUOUS_LOGIC
  name: Неоднозначная формулировка логики
  focus_area: fields
  severity: high
  description: 'Правило допускает несколько прочтений: неясен порядок применения, приоритет условий или
    область действия.

    '
  detection_hint: 'Перечни правил без явной нумерации приоритета. Слова «приоритет», «затем», «fallback»
    без указания порядка. Примечания, меняющие смысл основной таблицы. НЕ применять, если неоднозначность
    снимается соседним предложением или явным перечнем случаев.

    '
- id: UNSPECIFIED_FORMAT
  name: Не задана единица измерения или перечень допустимых значений
  focus_area: fields
  severity: medium
  description: 'Для КОНКРЕТНОГО поля в таблице не указана единица измерения, формат представления или
    перечень допустимых значений.

    '
  detection_hint: 'Применять ТОЛЬКО к строкам таблицы структуры данных, где названо конкретное поле, и
    только в трёх случаях: (1) поле времени без указания секунд или миллисекунд; (2) поле-признак или
    поле-код без перечня допустимых значений; (3) поле с числовой величиной без единицы измерения. НЕ
    применять, если тип данных поля уже указан в таблице. НЕ применять к разделам, заголовкам таблиц,
    названиям систем и описаниям источников. НЕ применять к общеизвестным отраслевым идентификаторам,
    формат которых задан стандартом.

    '
- id: DUPLICATE_SEMANTICS
  name: Дублирование смысла между полями
  focus_area: fields
  severity: medium
  description: 'Два поля описаны так, что разница между ними неясна.

    '
- id: SCHEMA_INCONSISTENCY
  name: Несогласованность схем между объектами
  focus_area: fields
  severity: medium
  description: 'Однотипные таблицы или одноимённые поля в разных местах описаны по-разному без объяснения.
    Сюда же — поле витрины, для которого не указан источник значения при наличии подходящего справочника
    в перечне источников.

    '
- id: MISSING_SOURCE_LOCATION
  name: Не указано расположение источника или кластера
  focus_area: sources
  severity: high
  description: 'Названы топики, папки или таблицы, но не указано, где физически расположены кластер, стенд
    или путь.

    '
  detection_hint: 'Для каждого Kafka-топика — кластер. Для каждой SFTP-папки — путь. Для каждой таблицы
    — кластер и схема. ЦИТАТА обязана содержать сам незаполненный фрагмент, а не соседнюю строку: замечание
    про кластер цитирует строку с кластером. Соглашения об именовании SCHEMA_*, TABLE_* заглушками не
    считать (см. конвенцию NAMING_PLACEHOLDERS).

    '
- id: FILTER_RESULT_UNDEFINED
  name: Не описана судьба отфильтрованных записей
  focus_area: filter
  severity: high
  description: 'Задано правило фильтрации, но не сказано, что происходит с записями, не прошедшими фильтр.

    '
- id: NO_DEDUP_OR_KEY
  name: Не задан ключ, гранулярность или правило дедупликации
  focus_area: fields
  severity: high
  description: 'Не зафиксирована уникальность строки в целевой таблице и правило разрешения дублей.

    '
  detection_hint: 'Применять там, где заявлен upsert, инкремент с пересечением окон, слияние нескольких
    источников в одну таблицу или поток событий, где дубли возможны технически. НЕ применять к витрине,
    которая полностью перезагружает свой период и имеет уникальную бизнес-дату у каждого расчёта: см.
    конвенцию MONTHLY_MART_FULL_RELOAD.

    '
- id: NO_VOLUME_ESTIMATE
  name: Не указан объём данных
  focus_area: volume
  severity: medium
  description: 'Отсутствует оценка объёма: строк в сутки, размера партиции, прироста хранилища.

    '
- id: NO_SCHEDULE
  name: Не указан регламент обновления
  focus_area: volume
  severity: clarification
  description: 'Указана частота, но не указано число, время запуска или окно обработки.

    '
- id: RETENTION_GAP
  name: Срок хранения указан не для всех слоёв
  focus_area: volume
  severity: low
- id: TIMEZONE_INCONSISTENT
  name: Трактовка часового пояса расходится между разделами
  focus_area: fields
  severity: high
  description: 'Конкретный пояс назван, но разделы трактуют границы периода в разных поясах, либо не
    сказано, какое поле несёт метку смещения.

    '
  detection_hint: 'Сверять объявленный часовой пояс требований с поясом в правилах фильтрации и с наличием
    коррекции на локальные пояса в источниках. Проверять, указано ли, какое поле несёт метку смещения.

    '
- id: PII_NO_PROTECTION
  name: Персональные данные без требований к защите
  focus_area: common
  severity: medium
  description: 'В структуре присутствуют идентификаторы абонента, требования к маскированию или доступу
    не описаны.

    '
- id: TEXT_STRUCTURE_ERROR
  name: Ошибка изложения в алгоритме
  focus_area: fields
  severity: low
  description: 'Формальная ошибка в записи алгоритма, не мешающая понять замысел, но требующая правки.

    '
- id: REFERENCE_LIST_MISSING
  name: Нет перечня используемых справочников
  focus_area: fields
  severity: medium
  description: 'В описании витрины отсутствует перечень нормативно-справочной информации, используемой
    при расчёте.

    '
  detection_hint: 'Собрать справочники, упомянутые в алгоритме, и проверить, есть ли в документе их сводный
    перечень с назначением каждого. Наличие справочников в общем списке источников без указания роли в
    расчёте перечнем НСИ не считается.

    '
