# Глоссарий: термины, которые в документации не расшифровывают.
#
# Зачем нужен. При слепой разметке 50 замечаний четыре ложных срабатывания
# оказались требованиями объяснить DAG, IMEI, GPRS и IMSI. Ещё одно —
# спором с предметной областью: модель решила, что название таблицы
# TABLE_IUM_RAW_PS не соответствует описанию «GPRS», не зная, что PS
# и есть packet switched.
#
# Кейсодатель подтвердил, что часть вещей опускается намеренно:
# «есть несколько полей, связанных с историей изменений, я их просто
# не включал». Глоссарий — механизм для таких договорённостей.
#
# Как пополнять. Если инструмент придирается к термину, который у вас
# все знают, добавьте строку сюда. Формат: термин и короткое пояснение
# через тире. Пояснение нужно не человеку, а модели — чтобы она не
# спорила со значением.
#
# Файл подставляется под компанию: у другого заказчика будет свой
# глоссарий при той же механике проверки.

terms:

  # Идентификаторы абонента и устройства
  - IMEI — идентификатор устройства, 15 цифр
  - IMSI — идентификатор абонента в сети
  - MSISDN — телефонный номер абонента
  - TAC — Type Allocation Code, первые 8 цифр IMEI, определяет модель устройства

  # Радиосеть
  - LAC — Location Area Code, код зоны расположения
  - CELL_ID — идентификатор соты базовой станции
  - БС — базовая станция
  - RNC — контроллер радиосети в 3G
  - eNodeB — базовая станция LTE
  - хэндовер — передача обслуживания абонента между сотами
  - MDT — Minimization of Drive Tests, сбор измерений с абонентских устройств

  # Телеком-события
  - CDR — Call Detail Record, запись о телеком-событии
  - GPRS — пакетная передача данных в мобильной сети
  - PS — packet switched, пакетная коммутация, интернет-трафик
  - MS — mobile switched, коммутация каналов, голос и SMS
  - prepaid — предоплатная схема обслуживания абонента
  - роуминг — обслуживание абонента в чужой сети

  # Хранилище и обработка
  - RAW — слой необработанных данных
  - DDS — детальный слой хранилища
  - ADDS — слой агрегированных детальных данных
  - CDM — витринный слой хранилища
  - DAG — пайплайн обработки данных в Airflow
  - Kafka — брокер сообщений для потоковой передачи
  - топик — именованный поток сообщений в Kafka
  - Flink — фреймворк потоковой обработки
  - HDFS — распределённая файловая система
  - SFTP — протокол передачи файлов
  - ORC — колоночный формат хранения
  - Parquet — колоночный формат хранения

  # Загрузка и обновление
  - инкремент — загрузка только новых данных
  - бэкфилл — загрузка исторических данных за прошлые периоды
  - upsert — вставка с обновлением существующих строк
  - партиция — секция таблицы, выделенная по значению поля
  - партиционирование — разбиение таблицы на секции

  # Объекты хранилища
  - витрина — таблица для конечного потребителя данных
  - агрегат — таблица с предрассчитанной сводкой
  - справочник — таблица с постоянными значениями для обогащения
  - джойн — соединение таблиц по ключу
  - бизнес-дата — дата, к которой относится событие с точки зрения учёта

# Соглашения, принятые в документации компании.
# Модель не должна считать их дефектами.
conventions:
  - Отсутствующий раздел помечается прочерком, а не удаляется из документа.
  - Поля, связанные с историей изменений, в описание витрин не включаются
    намеренно, если не несут смысла для задачи.
  - Даты в тексте записываются в формате ДД.ММ.ГГГГ, это однозначно.
  - >-
    Имена таблиц, полей и людей в примерах обезличены (TABLE_*, FIELD_*,
    USER_*, TOPIC_*, SCHEMA_*) — это замена реальных имён при подготовке
    документа, а не незаполненный плейсхолдер, и дефектом не является.
    Это НЕ распространяется на заглушки, оставленные вместо значения,
    которое в документе должно быть — CLUSTER без имени кластера,
    LINK_* вместо ссылки, PROJECT-XX вместо номера задачи, «Папка»
    вместо пути. Такие места дефект, их нужно называть.
