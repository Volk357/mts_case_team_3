[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "docreview-analysis-core"
version = "0.2.0"
description = "CLI Analysis Core for the DocReview platform"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32,<3",
  "PyYAML>=6,<7",
]

[project.scripts]
docreview = "docreview:main"

[tool.setuptools]
py-modules = ["docreview", "run_review", "check_formal", "docx_text"]
