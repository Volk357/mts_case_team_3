defects:
  - id: TEMPLATE_SECTION_MISSING
    name: Отсутствует обязательный раздел
    severity: high
    detectable_by: deterministic
    description: >
      В документе нет раздела, обязательного для выбранного шаблона, и раздел
      не оставлен с явной пометкой о неприменимости.
    detection_hint: >
      Определяется по template.yaml без модели и объединяется в одно замечание
      со списком отсутствующих разделов.

  - id: PLACEHOLDER_LEFT
    name: В документе осталась заглушка
    severity: medium
    detectable_by: deterministic
    description: >
      Вместо согласованного значения в финальном документе осталось TBD, TODO
      или значение в угловых скобках.
    detection_hint: >
      Определяется по списку placeholders из template.yaml без модели.

  - id: VAGUE_WORDING
    name: Непроверяемая формулировка
    severity: low
    detectable_by: deterministic
    description: >
      Требование использует субъективную характеристику, лазейку или открытый
      перечень и поэтому не задает однозначную проверку результата.
    detection_hint: >
      Определяется по словарю vague_wording из template.yaml без модели.

  - id: DANGLING_SECTION_REFERENCE
    name: Ссылка на отсутствующий раздел
    severity: high
    detectable_by: deterministic
    description: >
      Документ ссылается на именованный раздел, которого в нем нет.
    detection_hint: >
      Определяется сопоставлением именованной ссылки с разделами template.yaml.

  - id: AMBIGUOUS_REQUIREMENT
    name: Неоднозначное требование
    severity: medium
    description: >
      Требование допускает несколько трактовок из-за субъективных формулировок,
      неопределенных условий или отсутствия измеримого результата.
    detection_hint: >
      Ищи слова «быстро», «удобно», «по возможности», «при необходимости» и
      другие формулировки без метрики, условия или ожидаемого поведения.

  - id: INCOMPLETE_API_CONTRACT
    name: Неполный API контракт
    severity: high
    description: >
      Для интерфейса не определены обязательные входные данные, структура
      ответа, коды ошибок, идемпотентность или правила совместимости версий.
    detection_hint: >
      Проверяй каждый endpoint как самостоятельный контракт. Не требуй
      конкретный протокол, если интерфейс явно внутренний и его контракт дан
      другим способом.

  - id: ERROR_HANDLING_UNDEFINED
    name: Не определена обработка ошибки
    severity: high
    description: >
      Описан основной сценарий, но не определено поведение при отказе
      зависимости, таймауте, повторе запроса или некорректных данных.
    detection_hint: >
      Указывай конкретную операцию и конкретный неописанный отказ. Не создавай
      отдельное замечание для каждого похожего сбоя одного компонента.

  - id: SECURITY_REQUIREMENT_GAP
    name: Пробел в требованиях безопасности
    severity: high
    description: >
      Сервис обрабатывает доступ или пользовательские данные, но не определены
      аутентификация, авторизация, защита секретов или срок хранения данных.
    detection_hint: >
      Не предлагай конкретный продукт. Укажи, какое решение или ограничение
      необходимо зафиксировать в техническом задании.

  - id: OBSERVABILITY_GAP
    name: Недостаточная наблюдаемость
    severity: medium
    description: >
      Для значимой операции не определены логи, метрики, трассировка или сигнал,
      по которому команда узнает о нарушении целевого поведения.
    detection_hint: >
      Связывай замечание с описанным пользовательским или интеграционным
      сценарием, а не требуй абстрактно добавить все виды телеметрии.

  - id: ACCEPTANCE_CRITERIA_MISSING
    name: Непроверяемые критерии приемки
    severity: medium
    description: >
      Требование нельзя однозначно проверить тестом или наблюдением результата.
    detection_hint: >
      Проверяй наличие исходного условия, действия и измеримого ожидаемого
      результата. Не переписывай требование за автора.

  - id: INTERNAL_CONTRADICTION
    name: Внутреннее противоречие
    severity: high
    description: >
      Два утверждения документа задают несовместимое поведение или разные
      значения одного ограничения.
    detection_hint: >
      Приводи обе дословные цитаты. Если второй цитаты нет, классифицируй
      проблему как неполноту, а не противоречие.
