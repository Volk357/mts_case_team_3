terms:
  - API — программный интерфейс взаимодействия систем
  - SLA — согласованный уровень доступности сервиса
  - SLO — измеримая целевая характеристика надежности сервиса
  - RTO — допустимое время восстановления после отказа
  - RPO — допустимый объем потери данных, выраженный во времени
  - idempotency key — ключ, позволяющий безопасно повторить запрос

conventions:
  - Неприменимый раздел сохраняется в документе с пометкой «не применимо».
  - Названия продуктов и облачных платформ не требуются, если достаточно описать технологически нейтральное ограничение.
  - Инструмент указывает место и возможную корректировку, но не переписывает техническое задание за автора.
