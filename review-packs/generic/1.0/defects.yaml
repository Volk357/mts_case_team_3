# Таксономия дефектов для универсальной технической спецификации.
#
# Идентификаторы типов ТЕ ЖЕ, что в пакете mts-net: их понимает ядро,
# на них ссылается контракт с приложением, по ним считаются метрики.
# Меняются описания — то есть предмет проверки. Это и есть ответ на
# вопрос «что нужно поменять под другую компанию»: не код, а вот это.
#
# Все типы помечены status: calibrating честно: по этому профилю
# наблюдений нет, полнота и точность не измерены. Инструмент говорит
# об этом сам, помечая замечания в выдаче.

conventions:
- id: OPENAPI_IS_SOURCE_OF_TRUTH
  name: Схема OpenAPI — источник истины по контракту
  rule: Если документ ссылается на опубликованную схему OpenAPI, отсутствие в тексте перечня полей запроса
    и ответа дефектом не считается.
- id: STANDARD_HTTP_CODES
  name: Стандартные коды HTTP не расшифровываются
  rule: Коды 200, 201, 400, 401, 403, 404, 409, 500 общеизвестны; требовать их описания в документе не
    нужно.
defects:
- id: DANGLING_REFERENCE
  status: calibrating
  name: Ссылка на несуществующий объект
  focus_area: fields
  severity: high
  detectable_by: llm
  validated: not_tested
  description: 'Текст ссылается на перечень, поле или справочник, которого в ЭТОМ ЖЕ документе нет, и
    объект не назван по имени в кавычках. Ссылка на раздел, названный в кавычках, — отдельный тип DANGLING_SECTION_REFERENCE,
    он проверяется детерминированно.

    '
  detection_hint: 'Обороты «этих полей», «см. выше», «указанные ниже» без последующего перечня. Имена
    полей в описательных разделах, отсутствующие в разделе структуры данных. НЕ применять, если объект
    оформлен гиперссылкой или сопровождается признаком внешней ссылки: описание живёт в Confluence, это
    норма. НЕ применять к оборотам «см. алгоритм», «см. описание» — они указывают на внешний документ
    по ссылке. Дефект только тогда, когда объект должен быть описан внутри документа и не описан, и ссылки
    на него нет.

    '
  examples:
  - doc: Описание данных системы источника
    quote: Из этих полей удаляются лидирующие нули до первого значимого символа
    note: Перечень полей в документе отсутствует. Ссылки нет — дефект.
  - doc: Описание данных системы источника
    quote: Для data-трафика — по полю radioAccessTechnology
    note: Поле не описано в структуре TABLE_MSCP_RAW_KFK.
  - doc: Описание витрины-агрегата
    quote: сначала по (lac, cell), затем fallback-логика (см. алгоритм)
    verdict: rejected
    note: 'ЛОЖНОЕ СРАБАТЫВАНИЕ, пункт 6. Кейсодатель: «Тут тоже есть гиперссылка. Не ошибка.» Ссылка потерялась
      при конвертации в плоский текст.

      '
  comment_template: 'В разделе «{section}» есть отсылка к {object}, но сам {object} в документе не приведён
    и ссылка на него отсутствует. Требуется добавить перечень или ссылку.

    '
- id: DANGLING_SECTION_REFERENCE
  status: calibrating
  name: Ссылка на отсутствующий раздел документа
  focus_area: fields
  severity: high
  detectable_by: deterministic
  validated: not_tested
  description: 'Текст ссылается на раздел, названный по имени в кавычках, которого в документе нет.

    '
  detection_hint: 'Имя раздела берётся из самого текста ссылки и сверяется с заголовками документа с учётом
    синонимов шаблона. Обороты без имени раздела («см. выше», «см. алгоритм») к этому типу не относятся
    — это DANGLING_REFERENCE. Строка с URL рядом со ссылкой считается внешней ссылкой и не проверяется:
    описание живёт в Confluence, это норма.

    '
  comment_template: 'Ссылка ведёт на раздел «{object}», которого в документе нет. Требуется исправить
    ссылку или добавить раздел.

    '
- id: INTERNAL_CONTRADICTION
  status: calibrating
  name: Внутреннее противоречие
  focus_area: common
  severity: high
  detectable_by: llm
  validated: not_tested
  description: 'Два утверждения в одном документе прямо несовместимы.

    '
  detection_hint: 'Сверять продуктовые метрики с нефункциональными требованиями; способ загрузки с правилами
    обновления; регламент с глубиной данных. ОБЯЗАТЕЛЬНО процитировать обе стороны противоречия дословно.
    Если одну из сторон процитировать нельзя — это не противоречие, а неполнота, и тип не применяется.
    НЕ выводить противоречие из того, что часть случаев не описана: неописанный случай — это UNDEFINED_EDGE_CASE,
    а не конфликт. НЕ считать противоречием инкрементальный способ загрузки рядом с полной перезагрузкой
    месяца: см. конвенцию MONTHLY_MART_FULL_RELOAD.

    '
  examples:
  - doc: Описание потоков данных
    quote: 'Задержка: < 1 мин'
    conflicts_with: Стриминг в реальном времени (задержка ≈ 0 сек)
    note: Обе стороны в тексте, противоречие прямое.
  - doc: Описание витрины-агрегата
    quote: 'Способ загрузки: Инкремент'
    conflicts_with: 'Обновление: только полная перезагрузка месяца (без upsert)'
    verdict: clarification
    severity_override: clarification
    note: 'Пункт 8. Кейсодатель: «См. пункт 3. Но можно пометить этот момент как требующий уточнения.»
      Не ошибка, но формулировка в документе допускает неверное прочтение.

      '
  - doc: Описание витрины-агрегата
    quote: 'Сопоставление с TABLE_BS_REF: приоритет: (lac, cell_id)'
    verdict: rejected
    note: 'ЛОЖНОЕ СРАБАТЫВАНИЕ, пункт 10 в ответе кейсодателя. Модель объявила противоречие между «приоритет
      (lac, cell_id)» и «при lac = 0 джойн только по cell_id». Кейсодатель: «Тут описана логика, когда
      lac или cell_id не заполнен или равен нулю. Не ошибка.» Единственный промах, не объясняемый конвенциями:
      модель приняла ветвление за конфликт.

      '
  comment_template: 'Утверждение «{a}» противоречит «{b}». Разработчик выберет одно из двух наугад. Требуется
    зафиксировать целевое поведение.

    '
- id: INCOMPLETE_SCHEMA
  status: calibrating
  name: Структура данных описана не полностью
  focus_area: fields
  severity: high
  detectable_by: llm
  validated: not_tested
  description: 'Упомянут объект, структура полей которого не раскрыта и не доступна по ссылке.

    '
  detection_hint: 'Сопоставить список таблиц и слоёв из схемы потоков с разделом «Структура данных». НЕ
    применять к таблицам-источникам и справочникам, оформленным гиперссылкой: их структура лежит в Confluence.
    Применять в первую очередь к целевой таблице документа и к слоям, создаваемым этим потоком: они описываются
    здесь и нигде больше.

    '
  examples:
  - doc: Описание потоков данных
    note: 'Схема RAW → DDS → ADDS → CDM. Поля описаны только для TABLE_GEO_RAW_3G и TABLE_GEO_RAW_4G.
      Для DDS, ADDS, CDM структуры нет, ссылок тоже нет — дефект.

      '
  - doc: Описание данных системы источника
    note: TABLE_MSCP_RAW_SFTP указана как приёмник, структура не описана.
  - doc: Описание витрины-агрегата
    quote: SCHEMA_RAW | TABLE_IUM_RAW_PS | Необработанные данные по интернет-трафику (GPRS)
    verdict: rejected
    note: 'ЛОЖНОЕ СРАБАТЫВАНИЕ, пункт 4. Кейсодатель: «Для таких таблиц обычно есть гиперссылки в Confluence.
      Не ошибка.»

      '
  comment_template: 'Таблица {table} упомянута в разделе «{section}», её структура не описана и ссылка
    отсутствует. Требуется добавить перечень полей с типами либо ссылку на описание.

    '
- id: UNDEFINED_EDGE_CASE
  status: calibrating
  name: Не описана обработка граничного случая
  focus_area: fields
  severity: high
  detectable_by: llm
  validated: not_tested
  description: 'Логика расчёта не покрывает случай отсутствия значения, несовпадения при join или невалидных
    входных данных.

    '
  detection_hint: 'Для каждого join — что при отсутствии соответствия. Для набора условий вида «если X
    = 0», «если Y = 0» — что при ОДНОВРЕМЕННОМ выполнении. Для каждого справочника — что при отсутствии
    ключа. Дефект только там, где комбинация условий не покрыта. Если случай описан хотя бы одним правилом
    — не применять.

    '
  examples:
  - doc: Описание витрины-агрегата
    quote: Находится последняя запись с ненулевыми FIELD_LAC и FIELD_CELL_ID (по FIELD_TIME_STAMP).
    verdict: confirmed
    note: 'ПОДТВЕРЖДЕНО, пункт 7. Инструмент предложил присвоить «Unknown». Кейсодатель независимо ответил:
      «Если lac = 0, и cell = 0, то поле региона заполняется как Unknown.» Формулировка совпала дословно.
      Документ прошёл ревью тремя командами, ветка осталась незакрытой.

      '
  - doc: Описание витрины-агрегата
    quote: Присоединяется FIELD_VENDOR_NAME по tac из TABLE_DEVICE_REF
    note: 'Не описано поведение при отсутствии tac в справочнике: исключать абонента, писать NULL или
      «Не определён».

      '
  comment_template: 'В шаге «{step}» не описано поведение при {condition}. От выбора зависят итоговые
    цифры витрины. Требуется уточнить.

    '
- id: AMBIGUOUS_LOGIC
  status: calibrating
  name: Неоднозначная формулировка логики
  focus_area: fields
  severity: high
  detectable_by: llm
  validated: not_tested
  description: 'Правило допускает несколько прочтений: неясен порядок применения, приоритет условий или
    область действия.

    '
  detection_hint: 'Перечни правил без явной нумерации приоритета. Слова «приоритет», «затем», «fallback»
    без указания порядка. Примечания, меняющие смысл основной таблицы. НЕ применять, если неоднозначность
    снимается соседним предложением или явным перечнем случаев.

    '
  examples:
  - doc: Описание данных системы источника
    quote: 'Примечание: регион sib соответствует east'
    note: 'В таблице коррекции часового пояса Сибирь отсутствует. Неясно, относится ли соответствие только
      к часовому поясу или к обработке в целом.

      '
  - doc: Описание данных системы источника
    quote: не ранее 7 дней назад и не позже 2 часов вперёд от текущего времени
    note: 'Не указано, какая временная метка сравнивается: FIELD_CALL_START_TIME, FIELD_BIZ_DATE или время
      получения файла.

      '
  comment_template: 'Формулировка «{quote}» допускает несколько прочтений: {options}. Требуется однозначная
    формулировка.

    '
- id: UNSPECIFIED_FORMAT
  status: calibrating
  name: Не задана единица измерения или перечень допустимых значений
  focus_area: fields
  severity: medium
  detectable_by: llm
  validated: not_tested
  description: 'Для поля не указан формат значения: единицы, кодировка, шаблон строки.'
  comment_template: 'Для поля {field} не указан{a} {what}. Требуется дополнить описание.

    '
- id: DUPLICATE_SEMANTICS
  status: calibrating
  name: Дублирование смысла между полями
  focus_area: fields
  severity: medium
  detectable_by: llm
  validated: not_tested
  description: 'Два поля описаны так, что разница между ними неясна.

    '
  examples:
  - doc: Описание потоков данных
    note: 'FIELD_RADIUS «Радиус точности (метры)» и FIELD_LOC_ACCURACY «Точность локации (метры)». Разница
      не объяснена.

      '
  comment_template: 'Поля {a} и {b} описаны схожим образом. Требуется пояснить различие или объединить.

    '
- id: SCHEMA_INCONSISTENCY
  status: calibrating
  name: Несогласованность схем между объектами
  focus_area: fields
  severity: medium
  detectable_by: llm
  validated: not_tested
  description: 'Однотипные таблицы описаны по-разному без объяснения: разный состав полей, разные единицы,
    разный смысл одноимённых полей. Сюда же — поле витрины, для которого не указан источник значения при
    наличии подходящего справочника в перечне источников. Расхождение ТИПА одноимённого поля между таблицами
    структуры — отдельный тип SCHEMA_TYPE_MISMATCH, он проверяется детерминированно.

    '
  examples:
  - doc: Описание витрины-агрегата
    quote: FIELD_REGION_NAME | string | Название региона
    verdict: confirmed
    note: 'ПОДТВЕРЖДЕНО, пункт 12. Не указано, что значение берётся из поля region_name таблицы TABLE_REGION_REF,
      хотя справочник присутствует в перечне источников.

      '
  - doc: Описание потоков данных
    note: 'TABLE_GEO_RAW_3G содержит FIELD_LOC_ACCURACY и FIELD_VENDOR, TABLE_GEO_RAW_4G — нет, но содержит
      FIELD_SERVICE_TYPE.

      '
  - doc: между документами
    note: 'FIELD_IMSI: string в описании потоков геоданных, bigint в описании системы источника.

      '
  comment_template: '{object_a} и {object_b} описаны по-разному: {difference}. Требуется пояснить, намеренное
    ли это расхождение.

    '
- id: SCHEMA_TYPE_MISMATCH
  status: calibrating
  name: Тип одноимённого поля различается между таблицами
  focus_area: fields
  severity: medium
  detectable_by: deterministic
  validated: not_tested
  description: 'Одно и то же поле описано разными типами данных в разных таблицах структуры, и приведение
    типа в документе не описано.

    '
  detection_hint: 'Таблицы структуры сопоставляются по имени поля, сравнивается ячейка «Тип данных». Если
    рядом с полем сказано о приведении или преобразовании типа, расхождение считается объяснённым и дефектом
    не является.

    '
  comment_template: 'Поле {object} описано разными типами в разных таблицах структуры. Требуется привести
    типы к одному или описать приведение при загрузке.

    '
- id: MISSING_SOURCE_LOCATION
  status: calibrating
  name: Не указано расположение источника или кластера
  focus_area: sources
  severity: high
  detectable_by: llm
  validated: not_tested
  description: 'Не указано, где развёрнут сервис или внешняя система: нет адреса, окружения или способа
    доступа.'
  comment_template: 'Для {object} не указано {what}. Разработчик не сможет подключиться к источнику. Требуется
    дополнить.

    '
- id: PLACEHOLDER_LEFT
  status: calibrating
  name: Незаполненный плейсхолдер
  focus_area: common
  severity: medium
  detectable_by: deterministic
  validated: not_tested
  description: 'В документе остались заглушки вместо реальных значений.

    '
  detection_hint: 'Заглушками считать: CLUSTER без имени кластера, LINK_* вместо ссылки, PROJECT-XX вместо
    номера задачи, «Папка» вместо пути, угловые скобки вида <Наименование шага>. НЕ считать заглушками
    TABLE_*, FIELD_*, SCHEMA_*, TOPIC_*, USER_* — это соглашение об обезличивании (конвенция NAMING_PLACEHOLDERS).
    Никогда не предлагать «заменить SCHEMA_X на SCHEMA_X_PROD».

    '
  examples:
  - doc: Описание потоков данных
    note: LINK_DASHBOARD_GEO, LINK_GITLAB_PROJECT, LINK_JIRA_TASK, PROJECT-XX123
  - doc: Описание витрины-агрегата
    note: 'Кластер: CLUSTER'
  comment_template: 'В разделе «{section}» осталась заглушка {placeholder}. Требуется заменить на реальное
    значение.

    '
- id: FILTER_RESULT_UNDEFINED
  status: calibrating
  name: Не описана судьба отфильтрованных записей
  focus_area: filter
  severity: high
  detectable_by: llm
  validated: not_tested
  description: Описана проверка входа, но не сказано, что происходит с некорректным запросом.
  comment_template: 'Задано правило фильтрации «{rule}», но не описано, что происходит с отсеянными записями.
    Требуется уточнить.

    '
- id: NO_FILTER_DESCRIPTION
  status: calibrating
  name: Фильтрация не описана вовсе
  focus_area: filter
  severity: high
  detectable_by: deterministic
  validated: not_tested
  description: 'Не описана валидация входящих данных: что считать корректным запросом.'
  comment_template: 'Не описаны правила отбора входных данных для {object}. Требуется указать поле и условие
    фильтрации.

    '
- id: NO_DEDUP_OR_KEY
  status: calibrating
  name: Не задан ключ, гранулярность или правило дедупликации
  focus_area: fields
  severity: high
  detectable_by: llm
  validated: not_tested
  description: 'Не задан идентификатор запроса или правило идемпотентности: повторная отправка даст неизвестный
    результат.'
  comment_template: 'Для {table} не зафиксирован{a} {what}. Требуется указать явно.

    '
- id: TIMEZONE_UNDEFINED
  status: calibrating
  name: Часовой пояс не назван
  focus_area: fields
  severity: high
  detectable_by: deterministic
  validated: not_tested
  description: 'Поле «Часовой пояс» не называет конкретный пояс (значение вида «местное время региона»),
    из-за чего границы периода нетрактуемы.

    '
  detection_hint: 'Проверять значение поля «Часовой пояс»: должно быть конкретное обозначение (UTC, смещение,
    зона IANA).

    '
- id: TIMEZONE_INCONSISTENT
  status: calibrating
  name: Трактовка часового пояса расходится между разделами
  focus_area: fields
  severity: high
  detectable_by: llm
  validated: not_tested
  description: 'Конкретный пояс назван, но разделы трактуют границы периода в разных поясах, либо не сказано,
    какое поле несёт метку смещения.

    '
  detection_hint: 'Сверять объявленный часовой пояс требований с поясом в правилах фильтрации и с наличием
    коррекции на локальные пояса в источниках. Проверять, указано ли, какое поле несёт метку смещения.

    '
  examples:
  - doc: Описание витрины-агрегата
    quote: FIELD_BIZ_DATE | date | Бизнес-дата (1-е число месяца, за который формируется агрегат)
    verdict: confirmed
