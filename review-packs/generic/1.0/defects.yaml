- id: VAGUE_WORDING
  status: calibrating
  name: Расплывчатая формулировка (лазейка / незакрытый перечень)
  focus_area: text
  severity: low
  detectable_by: deterministic
  validated: not_tested
  description: 'Формулировка снижает проверяемость требования: лазейка («по возможности», «при необходимости»)
    или незакрытый перечень («и т.д.», «и другие»). Добор покрытия по внешним таксономиям (Femmer requirements
    smells: Loopholes, Open-ended Non-verifiable Terms). Словарь в template.yaml, только словари с 0 измеренных
    FP И без легитимного омонима. Superlative/comparative дают измеренный FP; subjective/universal/temporal
    — 0 FP, но омоним; идиома «включая, но не ограничиваясь» — нужен синтаксис. Все в бэклоге (probe_smells.py,
    taxonomy_coverage.md).

    '
