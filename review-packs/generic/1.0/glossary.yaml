# Глоссарий универсального профиля: термины, которые в спецификации сервиса
# не расшифровывают.
#
# Тот же механизм, что в пакете mts-net, другое содержание. Это ровно то,
# что заменяется под организацию: у одного заказчика не расшифровывают
# IMSI и GPRS, у другого — idempotency key и circuit breaker.

terms:
  - REST — архитектурный стиль HTTP-интерфейсов
  - gRPC — бинарный протокол удалённого вызова поверх HTTP/2
  - JWT — подписанный токен доступа в формате JSON Web Token
  - OAuth 2.0 — протокол делегированной авторизации
  - mTLS — взаимная аутентификация сторон по сертификатам
  - idempotency key — ключ, по которому повтор запроса не создаёт дубликат
  - rate limit — ограничение частоты запросов от клиента
  - circuit breaker — размыкатель, отсекающий вызовы к отказавшей зависимости
  - retry — повторная отправка запроса после сбоя
  - backoff — растущая пауза между повторами
  - timeout — предельное время ожидания ответа
  - SLA — соглашение об уровне обслуживания
  - SLO — целевой показатель уровня обслуживания
  - RPS — запросов в секунду
  - p95, p99 — процентили времени ответа
  - CRUD — создание, чтение, изменение и удаление
  - DTO — объект передачи данных между слоями
  - ETag — метка версии ресурса для условных запросов
  - CORS — правила доступа к ресурсу из другого источника
  - webhook — обратный вызов по событию на адрес клиента
  - staging — предпродуктивное окружение
  - feature flag — переключатель функциональности без выката
  - PII — персональные данные
  - RBAC — разграничение доступа по ролям
  - audit log — журнал действий пользователей
  - OpenAPI — формат описания HTTP-контракта
  - JSON Schema — формат описания структуры JSON
  - UUID — 128-битный идентификатор
  - ISO 8601 — стандарт записи даты и времени
  - UTC — всемирное координированное время

conventions:
  - Стандартные коды ответа (200, 201, 400, 401, 403, 404, 409, 429, 500) общеизвестны
    — требовать их расшифровки в документе не нужно.
  - Идентификатор сущности по умолчанию UUID; отдельного пояснения это не требует.
  - Если сервис не работает с локальным временем пользователя, метки времени считаются
    в UTC по ISO 8601.
  - Ссылка на опубликованную схему OpenAPI заменяет перечень полей в тексте документа.
