# Манифест универсального Review Pack.
#
# Второй профиль документа в проекте. Он существует, чтобы платформенность
# была проверяемой: одно ядро, одно приложение, единый JSON-контракт —
# и другой набор правил, подключаемый без изменения кода.
id: generic
version: "1.0"
name: Универсальная техническая спецификация
document_type: Спецификация сервиса с внешним интерфейсом
description: >
  Правила проверки технической спецификации сервиса: структура разделов,
  внешние интерфейсы, обработка ошибок, безопасность и критерии приёмки.
  Профиль не привязан к предметной области конкретного заказчика.
contents:
  template: template.yaml      # структура разделов и детерминированные правила
  defects: defects.yaml        # таксономия дефектов и конвенции
  glossary: glossary.yaml      # термины, которые не расшифровывают
  policy: policy.yaml          # политика приёмки: потолок 12, склонность к точности
