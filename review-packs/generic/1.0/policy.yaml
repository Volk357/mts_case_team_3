# Политика приёмки универсального профиля.
#
# Отличается от mts-net осознанно, и это главное, что показывает файл:
# политика — решение заказчика, а не свойство инструмента.
#
# У МТС NET кейсодатель прямо сказал, что пропуск дефекта дороже лишнего
# вопроса, поэтому там recall-склонность и потолок 20. Здесь профиль
# универсальный, читателя спецификации никто не обязывал разбирать два
# десятка замечаний, и склонность выбрана обратная.

# Потолок ниже: универсальная спецификация короче описания витрины,
# и двадцать замечаний на неё — заведомый перегруз.
ceiling: 12

# precision: лишняя придирка дороже пропуска. Обратное решение относительно
# профиля МТС NET — при том же коде и той же модели.
bias: precision

prompt:
  bias: >-
    Осторожность важнее полноты. Лишняя придирка дороже пропущенной мелочи.
    Сомневаешься — не выдавай.

  fragment_quota: >-
    Ориентир: от двух до пяти замечаний на фрагмент. Выдавай только те места,
    по которым разработчик действительно придёт с вопросом.

  document_quota: >-
    Ориентир: от одного до трёх замечаний на документ. Это дополнительный
    проход, основные дефекты уже найдены отдельно.

# Слой семантической верификации включён в режиме отсечения: при склонности
# к точности отвергнутые замечания убираются, а не просто помечаются.
verification:
  mode: enforcing
  batch_size: 8
