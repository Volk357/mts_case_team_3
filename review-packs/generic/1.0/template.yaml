# Структура универсальной технической спецификации.
#
# Второй профиль документа: он существует, чтобы проверить платформенность
# не рассуждением, а делом — одно ядро, одно приложение, другой набор правил.
# Разделы и маркеры здесь ДРУГИЕ, чем в пакете mts-net: там описание витрины
# данных, здесь спецификация сервиса с внешним интерфейсом.
#
# Правила детерминированного слоя переиспользуются те же (код общий), но
# настроены на другой документ — в этом и смысл: меняется конфигурация,
# а не код.

not_applicable_markers:
  - не применимо
  - неприменимо
  - n/a
  - "—"
  - "-"

sections:
  - name: Назначение сервиса
    required: true
    aliases: [Назначение сервиса, Назначение, Общие сведения]
  - name: Границы решения
    required: true
    aliases: [Границы решения, Область применения, Scope]
  - name: Пользователи и роли
    required: true
    aliases: [Пользователи и роли, Роли, Акторы]
  - name: Функциональные требования
    required: true
    aliases: [Функциональные требования, Требования, Функциональность]
  - name: Внешние интерфейсы
    required: true
    aliases: [Внешние интерфейсы, API, Интеграции, Контракты]
  - name: Модель данных
    required: true
    aliases: [Модель данных, Структуры данных, Сущности]
  - name: Обработка ошибок
    required: true
    aliases: [Обработка ошибок, Ошибки, Сценарии отказа]
  - name: Требования к безопасности
    required: true
    aliases: [Требования к безопасности, Безопасность, Security]
  - name: Нефункциональные требования
    required: true
    aliases: [Нефункциональные требования, НФТ, Производительность]
  - name: Критерии приёмки
    required: true
    aliases: [Критерии приёмки, Приёмка, Acceptance criteria]
  - name: Ограничения и допущения
    required: false
    aliases: [Ограничения и допущения, Допущения, Ограничения]

# Заглушки: шаблон плюс человекочитаемое имя того, что не заполнено.
placeholders:
  - pattern: '\bTBD\b'
    what: значение не заполнено
  - pattern: '\bTODO\b'
    what: незакрытая пометка автора
  - pattern: '\bХ{3,}\b'
    what: заглушка вместо значения
  - pattern: '<[а-яё ]+>'
    what: незаполненный плейсхолдер
  - pattern: 'уточняется на этапе'
    what: решение отложено без срока

# Признак обязательности у полей запроса и ответа.
nullability:
  field_row: '^\s*\|\s*[a-z_][a-zA-Z0-9_]*\s*\|'
  markers: ["обязательн", "необязательн", "required", "optional", "nullable", "NOT NULL"]
  table_markers: ["поле", "параметр", "атрибут"]
  table_requires: "поле"
  column_marker: "обязательн"

# Ссылка на внешний реестр интерфейсов — аналог Дата-каталога у витрин.
data_catalog:
  markers: ["реестр сервисов", "каталог api", "service registry", "реестр интерфейсов"]
  link_pattern: "https?://"

vague_wording:
  categories:
    loophole:
      - по возможности
      - при необходимости
      - насколько возможно
      - как правило
      - при желании
      - если потребуется
      - в общем случае
    open_ended:
      - и т.д
      - и т. д
      - и т.п
      - и т. п
      - и другие
      - и прочие
      - и так далее

# Описание фильтрации входящих запросов (валидация) — аналог фильтра витрины.
filter_step:
  heading: '^\s*Функциональные требования'
  marker: "валидац"

# Формат обмена: у сервиса это сериализация тела запроса и ответа.
serialization:
  section_markers: ["внешние интерфейсы", "api", "контракты"]
  header_markers: ["описание", "тип", "поле"]
  column_marker: "формат"
  empty_markers: ["—", "-", "н/д", "не указан", "не определён", "TBD", "уточняется"]

schema_tables:
  table_name_pattern: '\b([A-Z][A-Za-z0-9]*(?:Request|Response|Dto|Entity))\b'
  header_type_marker: "тип"
  header_field_markers: ["поле", "параметр", "атрибут"]
  field_pattern: '^[a-z_][a-zA-Z0-9_]*$'
  explained_markers: ["описан", "определён", "приведён", "см. приложение"]

section_reference:
  pattern: '\bраздел(?:а|у|ом|е|ы|ов|ам|ами|ах)?\b\s*[«"]([^»"\n]{3,80})[»"]'
  external_markers: ["http://", "https://", "www.", "confluence", "приложени"]

# Часовой пояс для меток времени в API.
timezone:
  label_pattern: '^часов\w*\s+пояс'
  zone_patterns: ["\\butc\\b", "\\bgmt\\b", "\\bмск\\b", "\\bmsk\\b", "iso\\s?8601", "[+-]\\s?\\d{1,2}(:\\d{2})?"]

# Проверка путей HDFS в этом профиле не применяется.
#
# Тип HDFS_PATH_INCOMPLETE привязан к предметной области витрин самим кодом
# проверки: имя типа задаётся не конфигом. В спецификации сервиса оно
# вводило бы в заблуждение, а незаполненный базовый адрес и без того ловится
# как PLACEHOLDER_LEFT — на той же строке и с понятным именем.
#
# Секция обязана присутствовать — код проверки требует ключ, — но триггер
# здесь ЗАВЕДОМО НЕСОВПАДАЮЩИЙ: `(?!)` не совпадает ни с чем никогда.
#
# Исходный `\bHDFS\b` не годился: в спецификации сервиса слово HDFS может
# встретиться (например, «выгрузка в HDFS не поддерживается»), и тогда
# проверка выдала бы тип HDFS_PATH_INCOMPLETE, которого в таксономии этого
# профиля нет вовсе. Пустой шаблон не годится тем более: он совпадает
# с любой строкой.
hdfs:
  trigger: '(?!)'
  format_markers: ["orc", "parquet", "avro", "csv", "json", "текстов"]
