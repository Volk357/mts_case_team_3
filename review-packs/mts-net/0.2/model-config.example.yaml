# Конфигурация модели для Analysis Core (--model-config).
# Единственный канал: ProcessRunner вычищает окружение дочернего процесса,
# поэтому OLLAMA_URL из окружения приложения до ядра не доходит.
#
# Реальный адрес сюда не коммитим — подставляется при деплое.
base_url: http://<host>:11434/api/chat
model: qwen3:30b-a3b
num_ctx: 32768
timeout: 900

# Опциональный фолбек на OpenAI-совместимый эндпоинт (OpenRouter).
# Нет блока — поведение как раньше. Срабатывает при ЛЮБОМ отказе основного
# эндпоинта (сеть, таймаут, HTTP-статус, невалидный JSON).
# URL определяется по формату: обязателен путь /chat/completions.
#
# Секрет — одним из двух способов:
#   * api_key: sk-or-...   — прямо в файле конфига (файл НЕ коммитим).
#                            Нужен для пути через воркер приложения:
#                            ProcessRunner вычищает окружение дочернего
#                            процесса, env до ядра не доезжает, а файл — да.
#   * api_key_env: OPENROUTER_API_KEY — ключ из переменной окружения
#                            (приоритет имеет api_key, если заданы оба).
#                            Для локального запуска CLI:
#                              export OPENROUTER_API_KEY=sk-or-...
#
# ВАЖНО: фолбек спасает прогон, а не воспроизводит метрики 89%/65% — они
# зафиксированы за конкретной сборкой qwen3:30b-a3b через Ollama.
# Модель на OpenRouter — другая модель/сборка, качество будет другим.
#
# Принудительный прогон через фолбек (без отказа Ollama) — для проверки
# и сравнения, виден в логах хостинга:
#   DOCREVIEW_FORCE_FALLBACK=1 python3 docreview.py analyze ...
#fallback:
#  base_url: https://openrouter.ai/api/v1/chat/completions
#  model: qwen/qwen3.8-flash
#  api_key_env: OPENROUTER_API_KEY
#  timeout: 120