# Манифест Review Pack. Приложение сверяет id и version из результата ядра
# с тем, что записано в задании: расхождение бракует результат целиком,
# даже при успешном завершении анализа. Поэтому источник истины — этот файл,
# а не имя каталога.
id: mts-net
version: "0.2"
name: Потоковые данные и витрины (МТС NET)
document_type: Описание витрины-агрегата / потока данных
description: >
  Правила проверки аналитической документации по шаблону «Потоковые
  данные/витрины»: структура разделов, восемь формальных требований
  кейсодателя, таксономия дефектов и конвенции компании.
contents:
  template: template.yaml      # структура шаблона и детерминированные правила
  defects: defects.yaml        # таксономия дефектов и конвенции
  glossary: glossary.yaml      # термины, которые в компании не расшифровывают
