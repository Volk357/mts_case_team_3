# Политика приёмки замечаний (acceptance policy) для Review Pack mts-net.
#
# ЗАЧЕМ ЭТОТ ФАЙЛ СУЩЕСТВУЕТ
#
# До 06.09.2026 решения «сколько замечаний считать нормой» и «что дороже —
# пропущенный дефект или лишняя придирка» жили в двух местах, ни одно из
# которых не версионируется вместе с правилами проверки:
#
#   1. текст промпта в run_review.py — «Полнота важнее осторожности.
#      Сомневаешься — выдавай», «Ориентир: от пяти до десяти замечаний»;
#   2. константы BUDGET_CEILING и BUDGET в Python.
#
# Из-за этого политика качества менялась правкой кода и не оставляла следа
# в версии пакета: два прогона с одинаковыми review_pack.id и version могли
# идти по разной политике, и по результату это было не видно.
#
# Теперь политика — часть пакета: она версионируется вместе с таксономией
# и шаблоном, а применённые значения уходят в результат (review_pack.policy),
# поэтому по любому прогону видно, по какой политике он выполнен.
#
# ВАЖНО ПРО ЗНАЧЕНИЯ НИЖЕ
#
# Они воспроизводят поведение на 06.09.2026 ДОСЛОВНО. Перенос формата не
# должен двигать метрики: полнота 88% по месту / 77% по типу снята именно
# на этих формулировках. Тексты уходят в промпт побуквенно, поэтому здесь
# числительные прописью — как в замеренном промпте, а не цифрами.

# Потолок замечаний в выдаче.
#
# Верхняя граница задана НЕ здесь, а в контракте с приложением:
# contracts/review-result.schema.json, findings.maxItems = 20. Значение
# больше контрактного приложение забракует целиком, поэтому ядро отвергает
# такой пакет сразу с REVIEW_PACK_INVALID, а не молча обрезает выдачу.
# Уменьшить потолок политикой можно — увеличить нельзя.
ceiling: 20

# Склонность приёмки: recall — пропущенный дефект дороже лишней придирки.
# Машинная метка, уходит в результат. Сам текст для модели — в prompt.bias.
bias: recall

# Тексты, уходящие в промпт дословно. Нумерация правил остаётся в шаблоне
# промпта, здесь только содержание строки.
prompt:
  # Правило склонности в проходе по фрагментам (PROMPT_DICT2).
  bias: >-
    Полнота важнее осторожности. Пропущенная проблема хуже лишней придирки.
    Сомневаешься — выдавай.

  # Ориентир объёма для прохода по фрагментам (PROMPT_DICT2).
  fragment_quota: >-
    Ориентир: от пяти до десяти замечаний на фрагмент. Меньше пяти — скорее
    всего ты не дошёл до конца списка типов.

  # Ориентир объёма для кросс-фрагментного прохода по документу целиком
  # (PROMPT_GLOBAL). Он меньше, потому что это дополнительный проход:
  # основные дефекты к этому моменту уже найдены проходом по фрагментам.
  document_quota: >-
    Ориентир: от двух до шести замечаний на документ. Это дополнительный
    проход, основные дефекты уже найдены отдельно.

# Слой семантической верификации: второе мнение по каждому замечанию слоя
# модели, с обратной постановкой задачи («найди основание отвергнуть»).
#
# Появился по пунктам 3, 4 и 5 архитектурного аудита: между «цитата
# настоящая» и «замечание показано» стояли только дедупликация и бюджет,
# то есть отбор по важности, а не суждение о справедливости.
verification:
  # off        — слой не вызывается вовсе;
  # advisory   — вердикт выносится и уходит в результат, выдачу НЕ меняет;
  # enforcing  — отвергнутые замечания убираются, их места достаются следующим.
  #
  # advisory по умолчанию, и это не осторожность, а порядок действий: цену
  # верификации нельзя измерить, если она сразу начинает менять то, что
  # измеряют. Сначала замер — сколько отвергнуто и справедливо ли, — потом
  # решение о enforcing, и это решение будет новой версией пакета.
  #
  # Второе основание: в enforcing слой добавляет к времени проверки
  # два-три вызова модели. На демонстрации это заметно.
  mode: advisory

  # Сколько замечаний уходит верификатору за один вызов. Замечания
  # группируются по фрагменту, из которого взята цитата: контекст нужен,
  # а подавать документ целиком на каждое замечание — это и окно модели,
  # и время. При восьми на партию два десятка замечаний укладываются
  # в две-три партии вместо двадцати вызовов.
  batch_size: 8
