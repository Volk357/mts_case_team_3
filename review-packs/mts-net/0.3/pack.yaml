# Манифест Review Pack. Приложение сверяет id и version из результата ядра
# с тем, что записано в задании: расхождение бракует результат целиком,
# даже при успешном завершении анализа. Поэтому источник истины — этот файл,
# а не имя каталога.
id: mts-net
version: "0.3"
name: Потоковые данные и витрины (МТС NET) — режим точности
document_type: Описание витрины-агрегата / потока данных
description: >
  Тот же профиль, что 0.2, и та же таксономия — отличается ТОЛЬКО политикой
  приёмки. Версия 0.2 показывает больше, включая спорное; 0.3 отсекает
  замечания, не прошедшие семантическую верификацию. Полнота падает
  с 89% до 65%, точность растёт с 55% до 79%.
  Выбор между ними — решение заказчика, а не свойство инструмента.
contents:
  template: template.yaml      # структура шаблона и детерминированные правила
  defects: defects.yaml        # таксономия дефектов и конвенции
  glossary: glossary.yaml      # термины, которые в компании не расшифровывают
  policy: policy.yaml          # политика приёмки: потолок выдачи и склонность
