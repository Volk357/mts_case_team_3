# Структура шаблона документации и формальные требования кейсодателя.
#
# Источник: материалы кейсодателя — структура разделов шаблона
# документации и перечень из восьми обязательных формальных требований.
#
# Всё, что здесь описано, проверяется БЕЗ модели. Полнота на этом классе
# сто процентов по построению: проверка сама и есть эталон. Дешевле
# и надёжнее модели, не тратит слоты бюджета замечаний и не галлюцинирует.
#
# Правило кейсодателя: отсутствующий раздел не удаляется, а помечается
# формулировкой «не применимо». Значит удалённый раздел — дефект,
# а раздел с пометкой — норма.
#
# Файл подставляется под компанию: у другого заказчика свой шаблон
# при той же механике проверки.

# Формулировки, которыми помечают неприменимый раздел.
# По письменному правилу — «не применимо». Прочерк добавлен потому,
# что на созвоне кейсодатель назвал именно его; принимаем оба.
not_applicable_markers:
  - не применимо
  - неприменимо
  - n/a
  - "—"
  - "-"

sections:

  - name: Общие сведения
    required: true
    aliases: [Общие сведения, Общая информация]

  - name: Решаемая проблема
    required: true
    aliases: [Решаемая проблема, Решаемые задачи]

  - name: Продуктовые метрики
    required: true
    aliases: [Продуктовые метрики, Метрики]

  - name: Заказчики
    required: true
    aliases: [Заказчики, Заказчик]

  - name: Нефункциональные требования
    required: true
    aliases: [Нефункциональные требования, Требования к агрегату, НФТ]

  - name: Системы-источники
    required: true
    aliases: [Системы-источники, Системы источники, Система-источник]

  - name: Data Catalog
    required: true
    aliases: [Data Catalog, Дата-каталог, Датакаталог, Каталог данных]

  - name: Исходники проекта
    required: true
    aliases: [Исходники проекта, Исходный код, GitLab, Git Lab]

  - name: Команда
    required: true
    aliases: [Команда]

  - name: JIRA
    required: true
    aliases: [JIRA, Джира]

  - name: Источники данных
    required: true
    aliases: [Источники данных, Источники и приемники данных,
              Источники и приёмники данных]

  - name: Источники обогащения данных
    required: true
    aliases: [Источники обогащения данных, Обогащение данных, Справочники]

  - name: Приемники данных
    required: true
    aliases: [Приемники данных, Приёмники данных, Приемники, Приёмники]

  - name: Схема потоков данных
    required: true
    aliases: [Схема потоков данных, Схема потока, Схема данных]

  - name: Алгоритм обработки потока
    required: true
    aliases: [Алгоритм обработки потока, Алгоритм расчёта, Алгоритм расчета,
              Алгоритм обработки]

  - name: Формирование ключа (kafka) / партиции (hdfs)
    required: true
    aliases: [Формирование ключа, Партиционирование, Ключ и партиции,
              Поле партиционирования]

  - name: Структура данных
    required: true
    aliases: [Структура данных, Структура данных CDM, Структура]

  - name: Пример данных
    required: true
    aliases: [Пример данных, Примеры данных]

  - name: DDL
    required: true
    aliases: [DDL, DDL схема, DDL-схема]

  - name: FAQ
    required: true
    aliases: [FAQ, Вопросы и ответы, ЧаВо]

  - name: История изменений
    required: true
    aliases: [История изменений, Changelog]

# Незаполненные заглушки. Отличаются от обезличенных имён: TABLE_*,
# FIELD_*, USER_*, SCHEMA_*, TOPIC_* — это замена реальных имён при
# подготовке документа и дефектом не является. Ниже — заглушки,
# оставленные вместо значения, которое в документе должно быть.
placeholders:
  - pattern: '^\s*Кластер\s*[:|]\s*CLUSTER\s*$'
    what: имя кластера
  - pattern: '\bLINK_[A-Z0-9_]+\b'
    what: ссылка
  - pattern: '\bPROJECT-XX[0-9]*\b'
    what: номер задачи в JIRA
  - pattern: '\|\s*Папка\s*\|'
    what: путь к SFTP-папке

# Требование 3: для каждого поля витрины явно указан признак
# обязательности. Строкой структуры считаем ту, где названо поле FIELD_*.
# Проверяем ТОЛЬКО таблицу приёмника/витрины: её заголовок объявляет колонку
# обязательности. У таблицы источников такой колонки нет по шаблону —
# её строки проверять нельзя (иначе ложные срабатывания).
nullability:
  field_row: '\bFIELD_[A-Z0-9_]+\b'
  markers: [NOT NULL, NULLABLE, обязательн, необязательн]
  table_markers: [приемник, приёмник]   # подзаголовок таблицы витрины/приёмника
  table_requires: таблица                # именно «Приемники. Таблица:», не раздел «Приемники данных»
  column_marker: обязательн              # заголовок колонки обязательности

# Требование 2: прямая ссылка на Дата-каталог. Дефект — раздел Data Catalog есть,
# но ССЫЛКА (URL) внутри него отсутствует. Проверяем тело раздела, а не наличие
# заголовка (заголовок остаётся и при удалённой ссылке).
data_catalog:
  markers: [data catalog, дата-каталог, датакаталог, каталог данных]
  link_pattern: 'https?://'
  # Раздел без URL флагуется ВСЕГДА (полнота, без ложных пропусков), но severity
  # зависит от наполнения: пустой раздел — точно нет ссылки (high); раздел с
  # содержанием — на реальном DOCX ссылка может быть гиперлинком, потерянным при
  # конвертации (конвенция EXTERNAL_LINKS_IN_CONFLUENCE), поэтому мягкое
  # «требует уточнения» (clarification), а не ложное high в демо.

# Требование 7: для файловых хранилищ полный путь в HDFS с форматом.
# Проверяем ТОЛЬКО строку-объявление пути хранения (контекст «путь/хранени»),
# а не заголовок раздела «Формирование ключа (kafka) / партиции (hdfs)»,
# где HDFS упомянут в скобках и формату там не место (иначе ложное срабатывание).
# Добор покрытия по Femmer requirements smells — только словари с 0 измеренных FP
# И без легитимного омонима (loophole, open_ended). Superlatives/Comparatives дают
# ИЗМЕРЕННЫЙ FP («наибольшее значение», «больше 100»); Subjective/Universal/Temporal
# дали 0 FP на synth, но имеют омоним — все в бэклоге (probe_smells.py, taxonomy_coverage.md).
vague_wording:
  categories:
    loophole:
      - по возможности
      - при необходимости
      - насколько возможно
      - как правило
      - при желании
      - если потребуется
    open_ended:
      - "и т.д"
      - "и т. д"
      - "и т.п"
      - "и т. п"
      - и другие
      - и прочие
      - и так далее
  # Идиома «включая, но не ограничиваясь» вынесена в бэклог: любая словарная
  # проба («включа»+«не ограничива») ловит легитимное «включаемых … не
  # ограничивает». Надёжно только через синтаксический разбор — см. taxonomy_coverage.md.

# Требование 4: типовые фильтры. Дефект — шаг фильтрации с заголовком, но без
# содержания и без пометки «не применимо». Детерминированно: заголовок шага есть,
# следующая непустая строка — уже другой шаг/раздел.
filter_step:
  heading: '^\s*Шаг\s+\d+'
  marker: фильтр

# Требование 1: сериализация входного потока. Дефект — в таблице «Источники
# данных» колонка «Сериализация» пуста («—») для источника. Детерминированно:
# scope на таблицу источников, парсинг колонки сериализации, проверка ячейки.
serialization:
  section_markers: [источники данных, источники и приемники данных, источники и приёмники данных]
  header_markers: [описание источника, тип источника, источник]
  column_marker: сериализац
  empty_markers: ['—', '-', 'н/д', 'не указан', 'не задан']

# Тип одноимённого поля различается между таблицами структуры данных.
# Детерминированно: таблицы берутся по строке-заголовку с колонкой «Тип данных»,
# имя таблицы — из ближайшей строки «Таблица: X» выше. Таблица кончается на
# первой строке без разделителя «|»: иначе строки «Примера данных» дочитываются
# как продолжение структуры. Сравниваются только поля-идентификаторы (FIELD_*
# и им подобные), тип — без учёта регистра.
# Законное приведение типа при загрузке от ошибки правило само не отличает,
# поэтому объяснение ищется в тексте: если рядом с именем поля сказано о
# приведении/преобразовании типа, расхождение считается объяснённым и дефектом
# не является. Severity medium, а не high, ровно поэтому.
schema_tables:
  table_name_pattern: 'Таблица:\s*(\S+)'
  header_type_marker: тип данных
  header_field_markers: [поле, атрибут]
  field_pattern: '^[A-Za-z_][A-Za-z0-9_]*$'
  explained_markers: [приведение типа, приводится к, приводятся к, преобразуется,
                      преобразуются, конвертируется, конвертируются, cast, приведён к,
                      приведение к типу]

# Ссылка на раздел, названный в кавычках, которого в документе нет.
# Детерминированно: имя раздела взято из самого текста ссылки, наличие раздела
# проверяется по заголовкам и первым ячейкам таблиц — там же, где их ищет
# find_sections. Синонимы шаблона учитываются: ссылка вправе звать раздел
# синонимом («Общая информация» при заголовке «Общие сведения»).
# Обороты без имени в кавычках («см. выше», «указанные ниже») сюда НЕ входят:
# без имени раздела правило перестаёт быть формальным — это остаётся модели
# (тип DANGLING_REFERENCE). Слово «раздел» ограничено границами слова: иначе
# «разделитель «точка с запятой»» читается как ссылка на раздел. «Подраздел»
# тоже вне правила — вложенные заголовки шаблон не описывает. Окончания
# перечислены поимённо (падежи слова «раздел»), а не «любые 0–3 буквы»:
# иначе «разделка «туши»» тоже читалась бы как ссылка на раздел.
# Строка со ссылкой-URL не проверяется: цель внешняя (конвенция
# EXTERNAL_LINKS_IN_CONFLUENCE), описание живёт в Confluence — это норма.
section_reference:
  pattern: '\bраздел(?:а|у|ом|е|ы|ов|ам|ами|ах)?\b\s*[«"]([^»"\n]{3,80})[»"]'
  external_markers: ['http://', 'https://', 'www.', 'confluence']

# Часовой пояс. Дефект — поле «Часовой пояс» заполнено, но значение не называет
# конкретный пояс («Местное время региона»), из-за чего границы периода
# нетрактуемы. Детерминированно: метка поля — в начале строки (иначе
# «Коррекция часового пояса …» из описания источника считалась бы полем),
# значение — после «:» или «|», а если строка обрывается — следующая непустая
# строка. Флаг ставится, только когда в значении НЕТ ни одного конкретного
# обозначения пояса. Случай «пояс назван, но разделы трактуют его по-разному»
# сюда не входит: он кросс-фрагментный, выделен в тип TIMEZONE_INCONSISTENT
# и остаётся за моделью (defects_prompt.yaml, GLOBAL_TYPES в run_review.py).
timezone:
  label_pattern: '^часов\w*\s+пояс'
  zone_patterns:
    - '\butc\b'
    - '\bgmt\b'
    - '\bмск\b'
    - '\bmsk\b'
    - '[+-]\s?\d{1,2}(:\d{2})?'          # смещение: +3, +03:00
    - '\b[a-z]{3,}/[a-z_]{3,}\b'         # IANA: Europe/Moscow

hdfs:
  trigger: '\bHDFS\b'
  format_markers: [orc, parquet, avro, csv, json, текстов]
  # Заголовок раздела «Формирование ключа (kafka) / партиции (hdfs)» исключается
  # как section-заголовок (по aliases выше); остальные строки с HDFS считаются
  # объявлением пути хранения независимо от формулировки.
